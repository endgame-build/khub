- argv: ["add", "repo", "--title", "Aux", "--repo", "acme/aux", "--status", "active"]
- argv: ["add", "repo", "--title", "Aux", "--repo", "acme/aux", "--status", "active", "--id", "aux-repo"]
- argv: ["query", "--format", "ids"]
