# build-spoke.yaml — the khub build-spoke preset (the per-code-repo side of a
# build project; counterpart of build-hub).
#
# 2 entity types; 2 relation predicates (+ the 4 universal edges from core).
# A spoke is authoritative for exactly two things: its public surface (the
# contracts it provides) and its interior (local technical decisions).
# Everything else — capabilities, planning, system decisions, repo catalog —
# is hub-authored; spokes claim against hub vocabulary, never mint it.
#
# Authoring decisions worth review:
#  - contract is the ONLY spoke→hub synced type (docs/build-hub-preset.md
#    Authorship). It is born here (docs/contracts/<slug>.md, spec file as
#    sibling docs/contracts/<slug>.yaml) and copied into the hub with
#    `synced_from` provenance. Its shape mirrors build-hub's contract MINUS
#    `provider`: the provider is this repo, derived from the repo of origin at
#    sync — it cannot be declared here (no repo/external-system types exist in
#    a spoke workspace) and cannot be wrong.
#  - kind/status enums MUST stay identical to build-hub's contract and evolve
#    add-only: N spokes validate against them, and synced entities must
#    validate hub-side. Guarded by the parity test in tests/test_build_spoke.py.
#  - tdr (technical decision record) is spoke-RESIDENT: never synced. A tdr
#    about this repo's ORM means nothing across repos. When one graduates to
#    system scope it is promoted BY HAND to a hub adr/pdr.
#  - hub_refs on tdr: plain-text hub slugs (capabilities, contracts) —
#    cross-workspace edges can't be integrity-checked in v1, so these are
#    grep-able claims, not edges.
#  - All paths live under docs/ — a spoke is a code repo; khub must not
#    colonize its root.
#  - Deliberately absent (add via schema edit when evidence appears):
#    component/module map (rots fastest; facet regenerates it), runbook, debt
#    (zero alive instances in the audits), insight (gotchas live in the
#    instruction/memory layer — CLAUDE.learnings.md, agent memories — not in
#    the entity graph), repo self-declaration manifest and feature/test specs
#    (explicit decision: no spoke→hub sync for them; specs are hub-authored).

version: "0.1.0"

entities:

  # ---------------------------------------------------------------- surface
  contract:
    layout: file
    path: docs/contracts
    attributes:
      title:    { required: true }
      kind:     { enum: [api, events, data], required: true }   # keep identical to build-hub
      status:   { enum: [proposed, active, deprecated], required: true }
      facet_id: { type: text }       # OAPI-XXX / AAPI-XXX — travels with the sync
    # no `provider`: the provider is this repo, injected hub-side at sync.
    # the spec itself is the sibling file; `resource` points at it. the body
    # carries what a spec can't: idempotency rules, auth model, versioning policy

  # --------------------------------------------------------------- interior
  tdr:
    layout: file
    path: docs/decisions
    attributes:
      title:    { required: true }
      status:   { enum: [proposed, accepted, rejected], required: true }
      hub_refs: { type: list }       # plain-text hub slugs, not edges
    relations:
      supersedes: { to: tdr }              # superseded = computed inverse, never stored
      affects:    { to: any, many: true }  # repo-local blast radius: contracts, other tdrs
