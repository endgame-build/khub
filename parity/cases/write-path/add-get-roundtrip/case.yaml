# An accented title mints a slug with its Latin accents spelled out
# (`Café — Straße` → `req-cafe-strasse`), and the entity reads back by it. A
# lookup composes a name before folding it, so an alias written composed
# (`Café`, NFC) is found from its decomposed, uppercased spelling (`CAFE` +
# combining acute, NFD, as macOS file names arrive).
steps:
- argv: ["init", "build-hub", ".", "--no-wire"]
- argv: ["add", "requirement", "--title", "Café — Straße", "--kind", "functional", "--format", "json"]
- argv: ["get", "req-cafe-strasse", "--format", "json"]
- argv: ["get", "req-cafe-strasse", "--format", "raw"]
- argv: ["edit", "req-cafe-strasse", "aliases", "Café", "--format", "json"]
- argv: ["get", "CAFÉ", "--format", "json"]
