# At the same preset version the shipped files have not moved, so every
# per-type value the workspace changed in storage.yaml or policy.yaml is its
# edit and upgrade keeps it (`carried`). Here fragment is stored as json: the
# json entity stays visible after upgrade, and a new one is written as json.
steps:
- argv: ["init", "firm-ops", ".", "--no-wire"]
- sh: |
    awk '{print} /^  fragment:$/ {f=1} f && /^    path: fragments$/ {print "    format: json"; f=0}' .khub/storage.yaml > s.tmp && mv s.tmp .khub/storage.yaml
    printf '{"type": "fragment", "title": "Kept", "stage": "raw", "created": "2026-01-15"}\n' > fragments/kept.json
- argv: ["upgrade", "--no-wire", "--format", "json"]
- argv: ["status", "--format", "json"]
- argv: ["add", "fragment", "--title", "New", "--stage", "raw", "--format", "json"]
