[project]
name = "khub"
version = "0.10.0"
description = "khub — schema-bound, agent-facing context management."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ilya Pukhalski", email = "ilya@pukhalski.com" }]
keywords = ["knowledge-graph", "agents", "schema", "markdown", "cli", "context-management", "okf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2",
    "typer",
    "rich",
    "ruamel.yaml",
    "python-frontmatter",
    "networkx",
]

[project.scripts]
khub = "khub.cli.main:main"

[project.urls]
Homepage = "https://github.com/endgame-build/khub"
Repository = "https://github.com/endgame-build/khub"
Documentation = "https://github.com/endgame-build/khub/tree/main/docs"
Changelog = "https://github.com/endgame-build/khub/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/khub"]

# Skills are authored at the repo root because that is the container
# `npx skills add` discovers without a manifest; map them into the package so
# `khub install-skills` can copy them from an installed wheel.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "khub/skills"

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, isolated unit tests (vocabulary, base-merge, mapping)",
    "integration: resolve flow, CRUD, graph, located errors",
    "e2e: full firm-ops scaffold + HQ snapshot validation",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Two default rules fight decisions khub made deliberately; the rest stay on.
ignore = [
    # `typer.Option(...)` / `typer.Argument(...)` in a parameter default IS the Typer
    # idiom — every command signature in cli/ is built that way.
    "B008",
    # khub dates are naive local ISO dates by design (`created`/`updated`, the stale
    # threshold, git commit dates). A tz-aware `date.today()` would change the model.
    "DTZ011",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/khub"]

[[tool.mypy.overrides]]
# Third-party modules without type stubs / py.typed markers.
module = ["yaml", "ruamel.*", "frontmatter", "networkx", "networkx.*"]
ignore_missing_imports = true
