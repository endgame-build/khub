# goreleaser builds the four binaries a khub release ships.
#
# CGO stays off everywhere, which is what makes cross-compiling trivial: the
# SQLite behind `khub search` is ncruces/go-sqlite3 (a wasm build, pure Go), so
# nothing here needs a C toolchain or a per-platform runner.
#
# Windows is deliberately absent. khub serializes collection writes with an
# advisory lock; the Windows path would be LockFileEx, which no khub has ever
# shipped or been tested against, so the target is out of scope rather than
# quietly half-supported.
version: 2

project_name: khub

builds:
  - id: khub
    main: ./cmd/khub
    binary: khub
    # Byte-deterministic archives per commit: an unexpected checksum change is
    # signal, not noise.
    mod_timestamp: "{{ .CommitTimestamp }}"
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      # internal/version.Version is the single source of truth now that the
      # pyproject/__init__ pair is gone; the tag supplies it at build time.
      - -s -w -X github.com/endgame-build/khub/internal/version.Version={{ .Version }}

archives:
  - id: khub
    # Deliberately NO version in the name. GitHub serves
    # /releases/latest/download/<asset> to anyone, resolving "latest"
    # server-side — but only if the asset name is known in advance, which a
    # version in it would prevent. That keeps `/releases/latest/download/<name>`
    # working with plain curl and no API call the day the repo goes public. The
    # version still identifies the release (the tag) and the build
    # (`khub --version`).
    #
    # npm/build-packages.sh derives this name from its platform table, so the
    # template and that script have to move together. Nothing else consumes
    # these assets: they are inputs to the npm package, not a channel.
    name_template: "khub_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  # npm/build-packages.sh verifies every archive against this file before it
  # unpacks one into the npm package's binaries/ directory.
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  # CHANGELOG.md is written by hand and ships in the archive; a generated commit
  # list on top of it would just be noise.
  disable: true

release:
  github:
    owner: endgame-build
    name: khub
  # Release CI turns these into the npm package in the same run that built
  # them. They are also fetchable directly at /releases/latest/download/<name>,
  # which is why the archive names above carry no version.
  draft: false
  prerelease: auto
