# Hand-maintained. gen_coverage.py, which first derived this file, was retired at
# the Go cutover (parity/tools/README.md); every entry here is edited by hand and
# must be exercised by a recorded case — `parity-run -coverage … -subset-of` fails
# on a param or code no fixture reaches.
commands:
- name: '(root)'
  params:
  - '--workspace'
  - '--version'
- name: 'init'
  params:
  - 'arg:preset'
  - 'arg:path'
  - '--preset-source'
  - '--name'
  - '--force'
  - '--no-wire'
  - '--format'
- name: 'upgrade'
  params:
  - '--dry-run'
  - '--no-schema'
  - '--no-wire'
  - '--format'
- name: 'status'
  params:
  - '--format'
- name: 'add'
  params:
  - 'arg:type_'
  - '--id'
  - '--draft'
  - '--strict'
  - '--body'
  - '--body-file'
  - '--no-template'
  - '--format'
- name: 'get'
  params:
  - 'arg:id_'
  - '--edges'
  - '--format'
- name: 'edit'
  params:
  - 'arg:id_'
  - '--strict'
  - '--body'
  - '--body-file'
  - '--format'
- name: 'link'
  params:
  - 'arg:id_'
  - 'arg:predicate'
  - 'arg:target'
  - '--format'
- name: 'unlink'
  params:
  - 'arg:id_'
  - 'arg:predicate'
  - 'arg:target'
  - '--format'
- name: 'remove'
  params:
  - 'arg:id_'
  - '--force'
  - '--format'
- name: 'query'
  params:
  - '--type'
  - '--tag'
  - '--has'
  - '--missing'
  - '--orphan'
  - '--stale'
  - '--draft'
  - '--active'
  - '--limit'
  - '--format'
- name: 'search'
  params:
  - 'arg:text'
  - '--type'
  - '--limit'
  - '--plain'
  - '--format'
- name: 'neighbors'
  params:
  - 'arg:id_'
  - '--predicate'
  - '--in'
  - '--out'
  - '--depth'
  - '--format'
- name: 'impact'
  params:
  - 'arg:id_'
  - '--predicate'
  - '--reverse'
  - '--format'
- name: 'history'
  params:
  - 'arg:id_'
  - '--predicate'
  - '--limit'
  - '--format'
- name: 'validate'
  params:
  - 'arg:target'
  - '--strict'
  - '--format'
- name: 'check'
  params:
  - '--strict'
  - '--format'
- name: 'stale'
  params:
  - '--days'
  - '--format'
- name: 'reindex'
  params:
  - '--dry-run'
- name: 'viz'
  params:
  - '--out'
  - '--open'
  - '--type'
# serve blocks until interrupted, so every fixture step is one of its refusals
# (cli-contract/serve-refusals). --port is reached there; the port bind itself
# is not, because the TTY gate fires before Listen — see TestListenRefusesBusyPort.
- name: 'serve'
  params:
  - '--port'
- name: 'backfill'
  params:
  - '--type'
  - '--dry-run'
- name: 'wire'
  params:
  - '--target'
  - '--dry-run'
- name: 'schema'
  params:
  - '--format'
- name: 'schema types'
  params:
  - '--format'
- name: 'schema show'
  params:
  - 'arg:type'
  - '--format'
- name: 'schema edges'
  params:
  - '--format'
- name: 'schema base'
  params:
  - '--format'
- name: 'schema snapshot'
  params:
  - '--format'
- name: 'schema diff'
  params:
  - '--format'
error_codes:
- alias_taken
- ambiguity_error
- bad_search_query
- bad_target
- collection_path_collision
- body_field_reserved
- bool_violation
- cardinality_violation
- date_violation
- duplicate_type
- empty_preset
- empty_relation_value
- enum_violation
- filter_error
- fts_unavailable
- id_prefix_undecided
- illegal_predicate
- internal_path_error
- inbound_edge_refusal
- invalid_schema
- invalid_snapshot
- invalid_slug
- lookup_error
- malformed_entity
- malformed_projection
# missing_base: unreachable through the CLI since the ontology/policy/storage
# split — LoadSchema always supplies the embedded base as the layered fallback,
# and the legacy shape that could still trip it is deleted with legacy.go.
- no_preset
- no_schema_snapshot
- no_slug_source
- no_workspace
- number_violation
- os_error
- pattern_violation
- preset_mismatch
- raw_linkml_smuggled
- referential_integrity
- schema_error
- self_link
- singleton_exists
- singleton_id
- slug_taken
- strict_unknown_field
- target_not_empty
- template_invalid
- template_required
- type_field_forbidden
- unknown_predicate
- unknown_preset
- unknown_relation_target
- unknown_type
format_specials:
- json
- ids
- raw
- tree
modes:
- pipe
- human
unreachable:  # documented, not fixture-coverable
- fts_unavailable    # build-dependent: fires only when the sqlite build lacks FTS5
- 'viz --open'       # opens a real browser; side effect excluded from fixtures
- duplicate_type     # dead in the Python baseline: the factory has zero callers
