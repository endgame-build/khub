name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # npm trusted publishing: the job proves its identity to npmjs.org with an
  # OIDC token instead of a stored secret, and npm attaches provenance.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser needs the full history to resolve the tag it is building.
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"
          cache: true
      # A tag is not a promise that CI ran on this commit — someone can tag an
      # older one. The gates are cheap next to shipping a broken binary.
      - name: Gates
        run: |
          go test ./...
          go build -o khub ./cmd/khub
          go build -o parity-run ./parity/runner
          ./parity-run -bin "$PWD/khub" -cases parity/cases
          bash smoke.sh
      - name: The tag and internal/version agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(./khub --version)
          # The release binary takes its version from -ldflags, so this compares
          # the tag against the constant a plain `go build` bakes in. They drift
          # apart silently otherwise — which is exactly what happened between
          # pyproject.toml and __init__.py for four minors.
          test "$tag" = "$built" || {
            echo "tag $tag != internal/version $built"; exit 1; }
      # v7 is the Node 24 runtime; v6 targeted Node 20, which GitHub now
      # force-runs on 24. Its only breaking change is the runtime — the
      # inputs below are unchanged. `version` pins the goreleaser TOOL,
      # a separate axis from the action tag.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing (OIDC) needs npm 11.5 or later; Node 22 bundles 10.x.
      - run: npm install -g npm@11
      - name: Assemble the npm package from the goreleaser artifacts
        run: npm/build-packages.sh "${GITHUB_REF_NAME#v}" dist npm/dist
      # No --provenance while the source repo is private: npm refuses to attest a
      # private repo, and the attestation would go into a public transparency
      # log. Add the flag when the repo goes public.
      - name: Publish to npmjs.org
        run: |
          # A prerelease tag must never become what a bare install resolves:
          # stable tags publish under `latest`, anything with a hyphen
          # (v0.20.0-rc1) under `next` — the npm spelling of the concern
          # `prerelease: auto` already handles for the GitHub release.
          dist_tag=latest
          case "$GITHUB_REF_NAME" in *-*) dist_tag=next ;; esac
          npm publish --access public --tag "$dist_tag" ./npm/dist/khub

      # Prove the channel end to end, through both paths a user takes — a
      # machine-global install and a per-repo pin — not a reimplementation.
      - name: Global install resolves the exact version
        run: |
          # Pin the tag being built: on an -rc tag, `latest` still resolves to
          # the previous stable (by design, see the publish step above), so an
          # unpinned install would prove nothing about this tag.
          #
          # A publish is not readable the instant it returns. npmjs.org fans a
          # new version out to its read path over a minute or two, and 0.25.0
          # failed a 30-second window on a package that was already live and
          # correct. Wait for the version to appear before installing, so the
          # install failing means something is wrong with the PACKAGE rather
          # than with the clock. `npm view` is the cheapest read that answers
          # "is it there yet"; ten minutes is far past observed propagation and
          # still bounded.
          version="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 40); do
            npm view "@endgame-build/khub@$version" version >/dev/null 2>&1 && break
            test "$i" = 40 && {
              echo "@endgame-build/khub@$version never appeared on the registry"; exit 1; }
            sleep 15
          done
          npm install -g --no-audit --no-fund --ignore-scripts \
            "@endgame-build/khub@$version"
          prefix=$(npm prefix -g)
          got=$("$prefix/bin/khub" --version)
          test "$got" = "${GITHUB_REF_NAME#v}" || {
            echo "installed $got, expected ${GITHUB_REF_NAME#v}"; exit 1; }
          "$prefix/bin/khub" --help >/dev/null
      - name: Per-repo install resolves the exact version
        run: |
          mkdir /tmp/khub-pin && cd /tmp/khub-pin
          npm init -y >/dev/null
          npm install --no-audit --no-fund --ignore-scripts "@endgame-build/khub@${GITHUB_REF_NAME#v}"
          got=$(npx @endgame-build/khub --version)
          test "$got" = "${GITHUB_REF_NAME#v}" || {
            echo "resolved $got, expected ${GITHUB_REF_NAME#v}"; exit 1; }

  # The linux artifact is executed above, before this workflow ends. The darwin
  # one never was — both npm verifications run on ubuntu — and darwin is where
  # khub is actually used. Two things go unproven without this: that the
  # cross-compiled darwin/arm64 binary runs at all, and that the launcher picks
  # it correctly.
  #
  # Apple Silicon refuses an arm64 binary carrying no signature at all, and
  # .goreleaser.yml has no `signs:` block — but Go's own linker ad-hoc signs
  # darwin/arm64, including when cross-compiling, which `codesign -dv` on a
  # `-trimpath -s -w` build confirms: flags=0x20002(adhoc,linker-signed). So
  # this is expected to pass. What it proves is the rest of the chain nobody
  # had checked on darwin: that the launcher resolves the right binary and the
  # package installs.
  #
  # Deliberately NOT signed here. Signing before running would change the
  # artifact under test, so a green check would say nothing about the bytes
  # that shipped. This runs exactly what was published.
  #
  # `needs: release` means a failure does not un-publish — the release is
  # already out by then. This is a detector, not a gate; gating publish on it
  # means reordering the workflow, which is a larger change than adding the eye.
  verify-macos:
    needs: release
    runs-on: macos-latest
    # It never checks out; it installs the published package and runs it.
    permissions: {}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: The published darwin binary runs
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Wait for the version to be readable before installing, exactly as
          # the linux job does — this runner starts fresh, so it is another
          # first read.
          for i in $(seq 1 40); do
            npm view "@endgame-build/khub@$version" version >/dev/null 2>&1 && break
            test "$i" = 40 && {
              echo "@endgame-build/khub@$version never appeared on the registry"; exit 1; }
            sleep 15
          done
          npm install -g --no-audit --no-fund --ignore-scripts \
            "@endgame-build/khub@$version"
          prefix=$(npm prefix -g)
          got=$("$prefix/bin/khub" --version)
          test "$got" = "$version" || {
            echo "installed $got, expected $version"; exit 1; }
          "$prefix/bin/khub" --help >/dev/null
