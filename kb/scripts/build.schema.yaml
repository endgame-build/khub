# build.schema.yaml — the whole contract for a kb corpus.
#
# GENERATED BY CONCATENATION, and 1:1 by construction: khub's presets/core.yaml
# followed by presets/build-lite/schema.yaml, both verbatim. No additions, no
# omissions, no reordering — tests/test_build_lite_standalone.py in the khub repo
# diffs it against those two sources and fails on any difference at all.
#
# It is the only file to edit when a project needs a field; kb hardcodes no type,
# field or predicate. Attributes kb never reads (`draft`, `author`, `sources`,
# `references`) stay declared: a closed schema and a deleted attribute do not mix.
#
# ============================================================ presets/core.yaml

# core.yaml — the khub base block.
#
# Every entity inherits these attributes and relations at resolve time (merged,
# never copied into the type's declaration). A type declares only its domain
# delta and may override a base attribute by redeclaring it. In v1 core.yaml
# holds ONLY the base block; entity types live in the preset (firm-ops.yaml).
# `khub init` writes this block as a `base:` header into the engagement's
# schema.yaml — it is supplied, not imported.
#
# Grammar:
#   attributes: map keyed by name -> { type, required?, default?, enum?, pattern? }
#               scalar `type` is one of text|number|date|datetime|bool|list (default text)
#   relations:  map keyed by predicate -> { to, many?, required? }
#               `to` is a type name, a list of type names, or `any`
#               the field name IS the predicate; single by default, `many: true` for multi-valued

base:
  attributes:
    type:        { type: text, required: true }    # discriminator — each entity kind pins its value
    draft:       { type: bool, default: false }    # lifecycle flag (default published)
    author:      { type: text }                    # the writer — person or agent
    created:     { type: date, required: true }
    updated:     { type: date }
    title:       { type: text }                    # OKF
    description: { type: text }                    # OKF
    resource:    { type: text }                    # OKF — canonical URI / link-out
    tags:        { type: list }
  relations:
    related:     { to: any, many: true }
    sources:     { to: any, many: true }
    references:  { to: any, many: true }
    depends_on:  { to: any, many: true, acyclic: true }

# ================================================ presets/build-lite/schema.yaml

# build-lite.yaml — the khub build-lite preset (a small build project's hub).
#
# 6 entity types; 4 relation predicates beyond the universal four from core
# (5 declarations; supersedes is declared on both adr and feature-spec).
# build-hub cut to necessity. A type earns a slot here only if it is referenced
# by id from elsewhere, walked as a graph, or gated by `check`. Prose a human
# reads start to finish is a body; a fact stored once and read once is an
# attribute; anything that churns with the code is a file in the repo, linked
# via the base `resource`.
#
# The six answer the five questions an agent asks mid-build: what am I building
# (feature-spec), what must hold (requirement), why can I not do X (adr, via
# `affects`), where does the code live and what talks to what (component), and
# what is this product (prd, arc42).
#
# Layout: one knowledge root plus specs/. knowledge/ is durable truth (the two
# narrative singletons at its top level, then requirements/, decisions/,
# components/); specs/ is delivery state.
#
# What build-hub has and this does not, and why:
#  - capability -> base `tags` on requirement. It is a grouping axis, and
#    feature-spec -> requirements already carries placement. Its real job in
#    build-hub is the UCAP-XXX facet-import spine, which lite does not do — no
#    facet_id anywhere here.
#  - pdr -> the prd body. Anything that constrains implementation is an adr.
#  - boundary, quality-attribute -> `requirement.kind: constraint`. Lost:
#    `enforcement` / `measurement` / `scenario` as queryable attributes; they
#    become body prose. This is the cut with the most real loss and the first
#    one back.
#  - domain, entity -> arc42 sections (Building blocks, Data model). At this
#    size the components ARE the map, and field-level detail lives in code.
#  - repo -> a plain `repo` text attribute on component. The registry's only
#    benefit was integrity-checking repo names against an enumeration.
#  - contract -> the machine spec (OpenAPI/AsyncAPI) is already a file on disk;
#    hang it off the providing component's base `resource`. The entity earns
#    its slot when two repos consume it independently.
#  - external-system -> `component` with `kind: external`. NOT a lite-only cut:
#    build-hub 0.3.0 made the same fold, so components carry over unchanged on a
#    move up. (Fourteen build-hub types are cut here; this is the fifteenth row
#    only in the sense that the name is gone from both presets.)
#  - baseline -> CI and dashboards. A git corpus records metrics stale by
#    construction.
#  - work-package -> feature-spec IS the work unit; there is nothing to split
#    across repos and `status` covers the flip.
#  - test-spec -> the feature-spec's Acceptance criteria section; the tests
#    themselves are files in the repo.
#  - roadmap, glossary -> prd sections. erd -> the arc42 Data model section.
#
# Add-back order when this stops fitting (each step is a schema edit, no
# surface code): (1) boundary + quality-attribute, (2) contract — alone; its
# provider targets `component`, and a vendor contract names a kind: external
# component, so do NOT reintroduce external-system, (3) repo + work-package,
# (4) domain + entity, (5) the rest — or switch to build-hub.
#
# Authoring decisions worth review:
#  - Storage form follows build-hub's rule: prose a human reviews = one file
#    per record with a lowercase ID-enumerated slug (ad-/fr-/cst-/cmp-/fs-NNN-slug
#    — `add --id` slugifies and lookup is case-sensitive, so uppercase would
#    not resolve). No collections: lite has no homogeneous wiring left to keep
#    in a registry.
#  - component.kind is REQUIRED: it is the ownership boundary, what we can
#    change versus what we can only react to. `repo` is a text attribute, not
#    an edge, so an external simply omits it.
#  - Four of the six md types ship a body template (prd, arc42, adr,
#    feature-spec). requirement and component deliberately do not — one
#    statement and one paragraph respectively, and every template heading is a
#    `validate` finding waiting to happen.
#  - `superseded` is never stored — computed inverse of the inbound
#    `supersedes` edge, on adr and feature-spec alike.
#  - No status field declares a `default` — `add` applies no schema defaults,
#    so status is always an explicit statement.
#  - prd and arc42 declare `orphan: true`. Every stored edge points UP the
#    durability ladder (feature-spec -> requirement), and both docs sit above
#    its top, so nothing points at them and they point at nothing. Without the
#    flag they are permanent orphan findings and `check --strict` can never go
#    green on a correct workspace. The flag is per type, not per layout: a
#    singleton carrying relations is still swept.

version: "0.1.0"

entities:

  # -------------------------------------------------- narrative: the two docs
  prd:
    layout: singleton
    path: knowledge/prd.md
    required: true              # the product source of truth — check fails without it
    orphan: true                # a narrative root: nothing points at it, by design
    when: >-
      someone states what the product is for, who it serves, or what is deliberately out
      of scope — edit the existing document, never add a second
    attributes:
      title: { required: true }
    # absorbs build-hub's roadmap and glossary as sections

  arc42:
    layout: singleton
    path: knowledge/arc42.md
    orphan: true
    when: >-
      the shape of the system is described or changes — context, building blocks, data
      model, a crosscutting concern — edit the existing document
    attributes:
      title: { required: true }
    # absorbs build-hub's erd as the Data model section

  # ------------------------------------------------------------- what must hold
  requirement:
    layout: file
    path: knowledge/requirements
    id_prefix: { by: kind, map: { functional: fr, constraint: cst, business-rule: br } }
    when: >-
      a rule is stated that the system must satisfy or must never violate. "must", "never",
      "always", "policy", "has to" are the tells; a stated invariant is a record, not a reply
    attributes:
      title: { required: true }   # override core OKF title -> required (slug source)
      kind:  { enum: [functional, constraint, business-rule], required: true }
    relations:
      realized_in: { to: component, many: true }
    # EARS-friendly prose in the body. `kind: constraint` absorbs build-hub's
    # boundary and quality-attribute: state the invariant, its measurement and
    # how it is enforced in the body.

  # ------------------------------------------------------------ why it is so
  adr:
    layout: file
    path: knowledge/decisions
    id_prefix: ad
    when: >-
      a choice is made, rejected, or revisited between real alternatives — including "we
      considered X and are not doing it". Capture the reasoning while it is still known
    attributes:
      title:  { required: true }
      status: { enum: [proposed, accepted, rejected], required: true }
    relations:
      supersedes: { to: adr, inverse: superseded, acyclic: true }
      affects:    { to: any, many: true }   # blast radius — the query that earns this type

  # ------------------------------------------------------------ what it is
  component:
    layout: file
    path: knowledge/components
    id_prefix: cmp
    when: >-
      a part of the system is named as a thing that can break, be owned, or be swapped —
      a service, a library of ours, or a vendor dependency we sit on
    attributes:
      title: { required: true }
      kind:  { enum: [service, library, external], required: true }
      stack: { type: text }   # ours: the runtime; external: the vendor
      repo:  { type: text }   # ours only — org/name; absent on an external
    # base `depends_on` carries component -> component and component -> external,
    # which is what makes "what breaks when this vendor changes" a graph walk.
    # base `resource` carries the API docs (external) or the machine spec (ours).

  # --------------------------------------------------- what to build (delivery)
  feature-spec:
    layout: file
    path: specs
    id_prefix: fs
    when: >-
      work is proposed, started, finished, or dropped. Record it when it is proposed, then
      edit `status` as it moves — do not wait until it is done
    attributes:
      title:  { required: true }
      status: { enum: [planned, active, done, dropped], required: true }
    relations:
      requirements: { to: requirement, many: true }   # obligation: what this change satisfies
      supersedes:   { to: feature-spec, inverse: superseded, acyclic: true }
    # the FS IS the work record — no separate feature container, no work-package
