# firm-ops/ontology.yaml — the domain model of the khub firm-ops preset: the
# operating graph of a consulting and delivery firm.
#
# 9 entity types; 10 firm-ops relation predicates (+ the 4 universal edges
# inherited from core: related / sources / references / depends_on) = 14 total.
# Described in docs/firm-ops-preset.md. The base block (type, draft, author,
# created, updated, title, description, resource, tags + the universal edges)
# is embedded in the binary since the ontology/policy/storage split — never
# copied here.
#
# Authoring decisions worth review:
#  - One enum per (type, field): `stage` and `source` differ across types; each
#    is inlined on its type and the compiler emits distinct enums.
#  - Lifecycle model: opportunity.stage follows the deal pipeline of whatever
#    system of record the firm runs its sales in (prospect / proposal-sent / won
#    / signed / lost); project carries `active: bool` (default true) instead of
#    a stage enum, because delivery has an owner and an end, not a funnel.
#  - External ids are carried as alias attributes (`crm_id`, `budget_id`,
#    `notes_folder_id`), never as edges: the id is a pointer into another tool,
#    not a node in this graph. Slug = id.
#  - partnership.primary_contact is a scalar string, not an object: imported
#    data is a name or "name <email>", and a nested object would not round-trip.
#  - fragment is keyed on `owner` (edge -> person, required): the writer owns
#    the fragment; `author` stays the free-text base field.
#  - meeting.engagement is an explicit union edge (opportunity | project |
#    partnership); meetings, transcripts and fragments are flat, not nested.
#  - Universal edges (related/sources/references/depends_on) are NOT redeclared
#    here — they come from core and are available on every type.
#  - `created`: core makes it required, but imported meetings and transcripts
#    often carry no `created` field, so those two types override it to optional
#    (a read-only validate cannot backfill).
#  - Every type redeclares its slug source as required (`name` on the directory
#    types, `title` on the rest): ids are bare slugs minted from it and nothing
#    else — there is no ordinal anywhere to fall back on — so an untitled
#    entity cannot be minted at all (`no_slug_source`).
#
# Storage form (layouts, inventory paths) lives in storage.yaml beside this
# file; firm-ops declares no per-type gates, so policy.yaml is empty.

version: "0.3.0"   # preset semver, stamped into workspace provenance at `khub init`

ontology:
  entities:

    # ---------------------------------------------------------------- pipeline
    opportunity:
      when: >-
        a possible piece of work with a named client is first mentioned — record it at 'we might', not at 'we won'
      attributes:
        name:   { type: text, required: true }   # deal name = slug source (like client/person; base `title` also mints)
        stage:  { enum: [prospect, proposal-sent, won, signed, lost], required: true }   # the deal pipeline of the sales system of record
        source: { enum: [referral, outbound, inbound, partner, event, existing-client] }
        crm_id:          { type: text, pattern: '^[0-9]+$' }   # deal id in the CRM (confidence lives there, not duplicated here)
        notes_folder:    { type: text }   # folder in the meeting-notes tool, if the firm uses one
        notes_folder_id: { type: text }
        updated:         { required: true }
      relations:
        client:  { to: client,      required: true }
        owner:   { to: person,      required: true }
        partner: { to: partnership }

    # ---------------------------------------------------------------- delivery
    project:
      when: >-
        work is agreed and has an owner; the opportunity that produced it becomes its origin
      attributes:
        title:  { required: true }   # slug source
        active: { type: bool, default: true }   # engagement ongoing? — a flag, not a stage enum
        source: { enum: [referral, outbound, inbound, partner, event, existing-client] }
        external_repo:   { type: text, pattern: '^[a-z0-9-]+/[a-z0-9-]+$' }   # owner/name of the delivery repo; absent on internal projects
        crm_id:          { type: text, pattern: '^[0-9]+$' }
        budget_id:       { type: text, pattern: '^[0-9]+$' }
        notes_folder:    { type: text }
        notes_folder_id: { type: text }
        updated:         { required: true }
      relations:
        client:             { to: client,  required: true }
        owner:              { to: person,  required: true }
        team:               { to: person,  many: true }
        origin_opportunity: { to: opportunity }
        partner:            { to: partnership }

    # ---------------------------------------------------------------- activity
    meeting:
      when: >-
        a call happens that produced a decision, a commitment, or a next step
      attributes:
        title:     { required: true }    # slug source
        created:   { required: false }   # imported meetings may carry no `created` — relax base-required (read-only validate can't backfill)
        date:      { type: datetime, required: true }   # datetime, not date: a meeting has a time of day
        call_type: { enum: [client, sales, partner, internal], required: true }
        source:    { enum: [recording, manual], required: true }
        note_id:   { type: text }
        attendees: { type: list }   # items { name, email }
      relations:
        engagement: { to: [opportunity, project, partnership], required: true }   # union edge
        transcript: { to: transcript }
        owner:      { to: person }

    transcript:
      when: >-
        a recording or written record of a call exists and needs to be findable later
      attributes:
        created:           { required: false }   # imported transcripts may carry no `created` — relax base-required (read-only validate can't backfill)
        source:            { enum: [recording], required: true }
        note_id:           { type: text, required: true }
        date:              { type: datetime, required: true }
        title:             { required: true }   # override core OKF title -> required
        creator:           { type: text, required: true }
        creator_email:     { type: text, required: true }   # format: email (not strictly validated in v1)
        notes_folder:      { type: text, required: true }
        notes_folder_id:   { type: text }
        calendar_event_id: { type: text }
        attendees:         { type: list }   # items { name, email }

    fragment:
      when: >-
        something worth keeping is said that fits no other type yet — a signal, a quote, an observation
      attributes:
        title:       { required: true }   # slug source
        stage:       { enum: [raw, mature, synthesis, promoted], required: true }
        promoted_to: { type: text }   # reference-area path — a resource link-out, NOT an edge
        confidence:  { type: number }
      relations:
        owner: { to: person, required: true }   # the writer owns the fragment (edge -> person), not `author`
      # related / sources are the universal core edges (inherited, not redeclared)

    # ---------------------------------------------------------------- outcomes
    case-study:
      when: >-
        delivered work becomes a story worth telling outside the firm
      attributes:
        title:     { required: true }   # slug source
        published: { type: bool, required: true }
        industry:  { type: text }
        phase:     { enum: [diagnose, prove, scale, full-cycle] }
        updated:   { required: true }
      relations:
        client:         { to: client, required: true }
        source_project: { to: project }

    # ---------------------------------------------------------------- directory
    partnership:
      when: >-
        a standing relationship with another firm is established or changes
      attributes:
        title:           { required: true }   # slug source
        partner:         { type: text, required: true }   # the partner firm's name (not an edge)
        active:          { type: bool, default: true }   # relationship ongoing? — consistent with project
        primary_contact: { type: text }   # a name or "name <email>"; scalar so imported data round-trips
        notes_folder:    { type: text }
        notes_folder_id: { type: text }
        updated:         { required: true }
      relations:
        owner:                 { to: person, required: true }
        related_opportunities: { to: opportunity, many: true }
        related_projects:      { to: project, many: true }

    person:
      when: >-
        a human is named who we will refer to again — ours, a client's, or a partner's
      attributes:
        name:       { type: text, required: true }
        role:       { enum: [consultant, engineer, manager, partner], required: true }
        department: { enum: [engineering, consulting, delivery-management, people, sales] }

    client:
      when: >-
        an organisation is named that we work with, pitch to, or are introduced to
      attributes:
        name:     { type: text, required: true }
        industry: { type: text }
        crm_id:   { type: text, pattern: '^[0-9]+$' }
        website:  { type: text }
        updated:  { required: true }
      relations:
        partner: { to: partnership }   # a client may have come through a partner
