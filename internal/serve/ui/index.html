<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>khub</title>
<!-- The id is the one cytoscape looks for before adding a style element of its
     own, which the CSP would refuse. -->
<link rel="stylesheet" href="/static/app.css" id="__________cytoscape_stylesheet">
<link rel="icon" href="data:,">
</head>
<body>
<header id="bar">
  <a id="brand" href="#/">khub</a>
  <nav id="tabs" aria-label="Views"></nav>
  <div id="find" role="search"></div>
  <div id="asof"></div>
</header>
<div id="banner" role="status" hidden></div>
<main id="main" tabindex="-1"></main>
<!-- Every tag carries src. The CSP forbids inline script, and the build gate
     in internal/serve/serve_test.go fails on any tag lacking one — including
     a mention inside a comment like this, which is why this note spells none.
     The classic tags are not deferred and the module tag is, so the cytoscape
     and dagre globals exist by the time app.js runs. -->
<script src="/static/cytoscape.min.js"></script>
<script src="/static/dagre.min.js"></script>
<script type="module" src="/static/app.js"></script>
</body>
</html>
