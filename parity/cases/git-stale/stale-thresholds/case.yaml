steps:
- argv: ["init", "build-hub", ".", "--no-wire"]
- argv: ["add", "requirement", "--title", "Old", "--kind", "functional"]
- sh: "git init -q . && git add -A && GIT_AUTHOR_DATE=2025-06-01T10:00:00Z GIT_COMMITTER_DATE=2025-06-01T10:00:00Z git commit -qm seed"
- sh: "perl -pi -e \"s/^updated:.*\\n//\" knowledge/requirements/req-old.md"
- sh: "git add -A && GIT_AUTHOR_DATE=2025-06-01T10:00:00Z GIT_COMMITTER_DATE=2025-06-01T10:00:00Z git commit -qm strip"
- argv: ["stale"]
- argv: ["stale", "--days", "10000"]
- argv: ["stale", "--format", "json"]
