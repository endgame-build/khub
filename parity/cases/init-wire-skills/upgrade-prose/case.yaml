# The text rendering of init-wire-skills/upgrade: one line per write, the .bak
# hint under a replaced file, and `nothing to do` when a run changed nothing.
mode: human
steps:
- argv: ["init", "build-lite", "."]
- argv: ["upgrade"]
- sh: "printf '\\n# mine\\n' >> .khub/storage.yaml && rm .khub/templates/adr.yaml knowledge/prd.md"
- argv: ["upgrade"]
- argv: ["upgrade"]
