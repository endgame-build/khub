# khub-preset: build-lite@0.1.0
ontology:
  entities:
    prd:
      when: someone states what the product is for, who it serves, or what is deliberately out of scope
      attributes:
        title:
          required: true
    arc42:
      when: the shape of the system is described or changes — context, building blocks, data model, a crosscutting concern
      attributes:
        title:
          required: true
    requirement:
      when: a rule is stated that the system must satisfy or must never violate. "must", "never", "always", "policy", "has to" are the tells; a stated invariant is a record, not a reply
      attributes:
        title:
          required: true
        kind:
          enum:
          - functional
          - constraint
          - business-rule
          required: true
      relations:
        realized_in:
          to: component
          many: true
    adr:
      when: a choice is made, rejected, or revisited between real alternatives — including "we considered X and are not doing it". Capture the reasoning while it is still known
      attributes:
        title:
          required: true
        status:
          enum:
          - proposed
          - accepted
          - rejected
          required: true
      relations:
        supersedes:
          to: adr
          inverse: superseded
          acyclic: true
        affects:
          to: any
          many: true
    component:
      when: a part of the system is named as a thing that can break, be owned, or be swapped — a service, a library of ours, or a vendor dependency we sit on
      attributes:
        title:
          required: true
        kind:
          enum:
          - service
          - library
          - external
          required: true
        stack:
          type: text
        repo:
          type: text
    feature-spec:
      when: work is proposed, started, finished, or dropped. Record it when it is proposed, then edit `status` as it moves — do not wait until it is done
      attributes:
        title:
          required: true
        status:
          enum:
          - planned
          - active
          - done
          - dropped
          required: true
      relations:
        requirements:
          to: requirement
          many: true
        supersedes:
          to: feature-spec
          inverse: superseded
          acyclic: true
