# No published standard exists for a PRD the way arc42 exists for the file beside
# this one, so three rules chose this shape and hold it:
#
#   - order follows the reader: narrative first, audit apparatus last;
#   - Title Case throughout, matching arc42, so no corpus fails on capitalisation;
#   - no section name collides inside this preset's own ontology. Hence `Features` and
#     not `Functional requirements`: `requirement` is already a type here, with
#     `kind: functional`.
#
# BREAKING with the kb 0.14.0 port: matching is a case-sensitive prefix and order is
# part of the contract, so a PRD written against the earlier template fails
# `body_shape` after `khub upgrade` until its headings are renamed. CHANGELOG carries
# the map.
#
# Required is "a PRD is meaningless without it". The rest are what a gated workflow
# adds — a corpus with no gate owes no recommendation and no audit trail, and a
# workflow with one requires them on its own account.
#
# User journeys stay inside Target Users and counter-metrics inside Success Metrics:
# khub reads only `##`, so declaring either as a section would seed a shape that
# fights how a PRD is written. Their guidance rides in the parent section's hint.

title: PRD
sections:
- heading: Document Purpose
  optional: true
  hint: two or three sentences - what this document decides, for whom, and the verdict in one breath
- heading: Vision
  hint: the problem and why now - every factual claim cited, every guess marked as one
  word_count: {min: 25, max: 200}
- heading: Target Users
  hint: who this serves, in their words - the jobs they are hiring it for, who it deliberately does not serve, and the journeys they actually narrated
- heading: Glossary
  hint: the ubiquitous language - term, one line each; a synonym introduced downstream is a defect
- heading: Features
  hint: what the product does and how you would know it works - group by capability under sub-headings, never by how it is built; link requirement ids (req- slugs) inline, coverage is a graph check
- heading: Non-Goals
  hint: what this deliberately does not do, each with the reason - the "let me also add this nearby thing" firewall
- heading: Deferred
  optional: true
  hint: not in this version, and what would bring it back - distinct from a permanent non-goal
- heading: Success Metrics
  hint: how we know it worked - a baseline, a target, a date and the source someone queries; and what must NOT worsen while they move
- heading: Roadmap
  optional: true
  hint: what lands in what order, and what each order buys - omit it where a separate plan owns sequencing
- heading: Alternatives & Recommendation
  optional: true
  hint: what else was on the table and what each would cost, then the verdict and what would disconfirm it
- heading: Open Questions
  optional: true
  hint: known unknowns, each with who would answer it and what it blocks
- heading: Assumptions Index
  optional: true
  hint: every assumption this document proceeds on, and the consequence if it is wrong
- heading: Grounding Evidence
  optional: true
  hint: the audit appendix - what was read to write this, and when

lenses:
- code: scope
  name: The line, from both sides
  instruction: |
    Non-Goals is where a PRD earns its keep, and it is the section that decays first.
    Does it name the thing a reasonable reader would assume is in scope? "Not this
    product, ever" and "not this version, and here is what would change that" are
    different claims — the second belongs under Deferred.
- code: journeys
  name: Journeys reach capabilities
  after: scope
  instruction: |
    Every journey should have capabilities that make it possible, and every capability
    should serve a journey. A capability no journey needs is either load-bearing for a
    reason nobody wrote down, or it is not needed. A journey that only ever ends well
    cannot exercise the failure handling the product also has to do.
- code: metrics
  name: Measurable, dated, and guarded
  after: scope
  instruction: |
    A success metric needs a number, a date and a source of truth. Then ask the harder
    question: what could someone break while moving it? That answer is the
    counter-metric, and it is as load-bearing as the target.
- code: assumptions
  name: Assumptions, marked as such
  after: metrics
  instruction: |
    Scan for claims about users, volumes or the market that are stated as fact. Mark
    each one inline as `[ASSUMPTION: …]` so a later reader can tell what was known
    from what was guessed — the two look identical in prose six months on.
