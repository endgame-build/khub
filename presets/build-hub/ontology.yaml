# build-hub/ontology.yaml — the domain model of a build project's knowledge hub.
#
# 11 entity types; 12 relation predicates beyond the universal four from core
# (12 declarations). One preset: 0.6.0 merged the seventeen-type build-hub and
# the six-type build-lite (`build-lite` still resolves, as an alias). A type
# earns a slot here only if it is referenced by id from elsewhere, walked as a
# graph, or gated by `check`. Prose a human reads start to finish is a body; a
# fact stored once and read once is an attribute; anything that churns with the
# code is a file in the repo, linked via the base `resource`.
#
# The eleven answer the questions an agent asks mid-build: who is this for and
# what do they do (actor, use-case), what does the product do at map level
# (capability), what must hold and where (requirement), why can I not do X
# (adr, via `affects`), what exists, who owns it, may I build on it (component,
# with owner/lifecycle/tier), which system is this in and what do we sit on
# outside (system; a vendor is a component with kind: external), what is
# promised and who consumes it (api), where does the code live (repo), and what
# is this product (prd, arc42). What is in flight is not here: the framework
# that runs the build owns specs, and an external spec points IN through its
# own frontmatter (`use_cases: [uc-…]`, `requirements: [req-…]`); khub neither
# scans it nor resolves those ids.
#
# Every stored edge points UP the durability ladder and lives on the entity
# being born; the inverse of each is computed at read time, never written.
# The field name is the predicate; the verb is how to read it: use-case is
# performed by an actor, belongs to a capability, is served by components;
# a requirement is placed in capabilities, governs use cases, is realized in
# components; a component is part of a system, lives in a repo, consumes apis;
# an api is provided by a component. `served_by` is ArchiMate's Serving read
# from the served side.
#
# Deliberately absent, and where that content lives instead:
#  - feature-spec, work-package, test-spec (and `specs/`) -> the framework that
#    runs the build. Two tools writing one directory is one too many.
#  - roadmap, glossary -> prd sections. erd -> arc42, under Crosscutting Concepts.
#  - pdr -> adr is any decision record, product or technical.
#  - baseline -> CI and dashboards. A git corpus records metrics stale by
#    construction.
#  - contract -> `api`, under Backstage's name: `provider` on the api,
#    `consumes` on the component, consumers computed.
#  - external-system -> `component` with `kind: external`. A system is a group
#    of components with one owner; a vendor has APIs, not components we can
#    name, so it is not one.
#  - boundary, quality-attribute -> `requirement.kind: constraint` and
#    `non-functional` plus `enforcement`. Lost: `scenario` / `measurement` as
#    queryable attributes; the first step back on the ladder if that hurts.
#  - domain, entity, team, event -> the ladder in docs/build-hub-preset.md,
#    each a schema edit with no surface code.
#
# Authoring decisions worth review:
#  - component.kind is REQUIRED: it is the ownership boundary, what we can
#    change versus what we can only react to. `repo` is an edge to the repo
#    registry (ours only), so an external simply omits it.
#  - `owner` is optional text in slug form (`team-payments`) on component and
#    system, and nowhere else: repo ownership is derived from the components
#    that name the repo. When ownership becomes a walk, add `team` and flip
#    the line to `{ to: team }`; slugs resolve without a file edit.
#  - use-case.trigger is REQUIRED and `actor` is not: a scheduled or
#    event-driven flow needs no actor called "System". The `actor` lens asks
#    for one when the trigger is human.
#  - api.provider is REQUIRED so `check` catches an interface nobody owns; a
#    vendor API's provider is the external component.
#  - `superseded`, `serves` and `consumed_by` are never stored — computed
#    inverses, named so `get --edges` on the target shows them.
#  - No status field declares a `default` — `add` applies no schema defaults,
#    so status is always an explicit statement.
#
# Storage form and per-type gates live beside this file: storage.yaml carries
# layout/path/id_prefix/id_date, policy.yaml carries required/orphan.

version: "0.6.0"

ontology:
  entities:

    # ------------------------------------------------ narrative: the two docs
    prd:
      when: >-
        someone states what the product is for, who it serves, or what is deliberately out
        of scope
      attributes:
        title: { required: true }
      # absorbs roadmap and glossary as sections

    arc42:
      when: >-
        the shape of the system is described or changes — context, building blocks, data
        model, a crosscutting concern
      attributes:
        title: { required: true }
      # absorbs erd: the domain data model, under Crosscutting Concepts

    # ---------------------------------------------------- the map: what it does
    capability:
      when: >-
        a coherent chunk of product value is named as a thing the product does — the map
        that use cases belong to and requirements are placed in
      attributes:
        title: { required: true }
      # the join key an import from facet lands on (FUNC-*); title only, prose
      # in the body

    # ---------------------------------------------- who, and what they do
    actor:
      when: >-
        a human role is named that uses the product — a customer, an admin, an operator.
        Not a system or a scheduler; those are a use case's `trigger`
      attributes:
        title: { required: true }
      # a persona is the body; automated triggers are not actors

    use-case:
      when: >-
        someone describes what a user does end to end, or a flow the system runs on a
        schedule or an event. Record it when the flow is described, not when it ships
      attributes:
        title:   { required: true }
        trigger: { enum: [human, scheduled, event, external], required: true }
      relations:
        actor:      { to: actor }                        # performed by
        capability: { to: capability }                   # belongs to
        served_by:  { to: component, many: true, inverse: serves }   # served by — the blueprint edge
      # a use case is one goal one actor achieves, or a longer flow; the length
      # lives in the body. "What breaks for users if this component dies" is
      # `served_by` inverted: `serves` on the component, computed, never stored.

    # ---------------------------------------------------------- what must hold
    requirement:
      when: >-
        a rule is stated that the system must satisfy or must never violate. "must", "never",
        "always", "policy", "has to" are the tells; a stated invariant is a record, not a reply
      attributes:
        title:       { required: true }   # override core OKF title -> required (slug source)
        kind:        { enum: [functional, non-functional, constraint, business-rule], required: true }
        enforcement: { enum: [ui, backend, database, external, review] }   # what holds it up
      relations:
        capabilities: { to: capability, many: true }     # placed in
        use_cases:    { to: use-case, many: true }       # governs
        realized_in:  { to: component, many: true }      # realized in
      # EARS-friendly prose in the body. `kind: constraint` and `non-functional`
      # absorb boundary and quality-attribute; `kind: business-rule` absorbs a
      # facet rule, whose concern type becomes a tag. The id is a literal
      # `req-` (not derived from `kind`), so `kind` is an ordinary field:
      # `edit <id> kind …` works without making the id wrong, and `add` mints
      # without `--kind`.

    # --------------------------------------------------------- why it is so
    adr:
      when: >-
        a choice is made, rejected, or revisited between real alternatives — product or
        technical, including "we considered X and are not doing it". Capture the reasoning
        while it is still known
      attributes:
        title:  { required: true }
        status: { enum: [proposed, accepted, rejected], required: true }
      relations:
        supersedes: { to: adr, inverse: superseded, acyclic: true }
        affects:    { to: any, many: true }   # blast radius — the query that earns this type

    # --------------------------------------------------------- what it is
    system:
      when: >-
        a group of components is named as one thing with one owner and one boundary — a
        product, a platform, a deployable whole
      attributes:
        title: { required: true }
        owner: { type: text }   # slug form; `team` on the ladder turns this into an edge
      # no stored edges: `component.system` points here and the components are
      # the computed inverse. A one-system workspace never creates one.

    component:
      when: >-
        a part of the system is named as a thing that can break, be owned, or be swapped —
        a service, a library of ours, or a vendor dependency we sit on
      attributes:
        title:     { required: true }
        kind:      { enum: [service, library, external], required: true }
        stack:     { type: text }   # ours: the runtime; external: the vendor
        owner:     { type: text }   # slug form; who to ask
        lifecycle: { enum: [experimental, production, deprecated] }   # may I build on this
        tier:      { enum: [tier-1, tier-2, tier-3] }                 # how careful must I be
      relations:
        system:   { to: system }                                     # part of; ours only
        repo:     { to: repo }                                       # lives in; absent on an external
        consumes: { to: api, many: true, inverse: consumed_by }      # consumes — the churny side
      # base `depends_on` carries component -> component and component -> external,
      # which is what makes "what breaks when this vendor changes" a graph walk.

    api:
      when: >-
        an interface is agreed, published, or versioned — a REST or GraphQL surface, a gRPC
        service, an event stream, a data feed
      attributes:
        title:  { required: true }
        kind:   { enum: [rest, graphql, grpc, events, data], required: true }
        status: { enum: [proposed, active, deprecated], required: true }
      relations:
        provider: { to: component, required: true }   # provided by; a vendor API names the external component
      # policy prose (versioning, auth, idempotency) is the body; the machine
      # spec (OpenAPI, AsyncAPI, a schema) is a file linked via `resource`.
      # Consumers are the computed inverse of `component.consumes`.

    repo:
      when: >-
        a codebase is named that holds part of this system — a service's repo, a shared
        library, a monorepo group
      attributes:
        title:  { required: true }
        repo:   { type: text, required: true, pattern: '^[a-z0-9._-]+(/[a-z0-9._-]+)+$' }   # org/name, nested groups allowed
        status: { enum: [active, archived], required: true }
      # the registry: `component.repo` must resolve here. An engagement tightens
      # the pattern to its org. Ownership is derived from the components that
      # name this repo, never stored here.
