name: Publish install.sh

# khub.end.game/install.sh is the front door: `curl -fsSL
# https://khub.end.game/install.sh | sh`. This repo is the source of truth for
# that file, and this workflow is the only thing that writes it — so the two
# cannot drift.
#
# Only install.sh is published. It holds no secrets (platform detection, a
# download, a checksum, one `mv`); the binaries it fetches stay private in this
# repo's releases and need a token, which the script sources from the user's
# own gh/keychain.
on:
  push:
    branches: [main]
    paths: ["install.sh"]
  # Re-publish without a code change — after rotating the Cloudflare token, or
  # to repair the live copy.
  workflow_dispatch:

# Two deploys racing would be a coin flip over which one lands last.
concurrency:
  group: publish-install
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Never publish a script that cannot run. This is the same gate CI
      # applies to the PR, repeated here because this workflow can also be
      # dispatched by hand against whatever is on main.
      - name: Lint before publishing
        run: |
          shellcheck install.sh
          sh -n install.sh
      - name: Stage the site
        run: |
          mkdir -p site
          cp install.sh site/install.sh
          # Also at the apex, so `curl -fsSL https://khub.end.game | sh` works.
          # Pages serves index.html for "/", and curl does not care that the
          # body is a shell script rather than markup.
          cp install.sh site/index.html
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Hard failure, not a skip. This warned-and-passed while Cloudflare
          # was still being set up, which is exactly the shape that lets a green
          # run sit on top of a stale live script — the drift this workflow
          # exists to make impossible. The credentials are configured now, so
          # their absence is a broken repo, not a not-yet-ready one.
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set."
            echo "khub.end.game/install.sh cannot be updated without them."
            exit 1
          fi
          npx --yes wrangler@4 pages deploy site \
            --project-name "${{ vars.CLOUDFLARE_PAGES_PROJECT || 'khub' }}" \
            --branch main
      # Deploying is not the same as being served. Pages propagation is quick
      # but not instant, so this retries before deciding the deploy failed.
      - name: The live copy matches this commit
        run: |
          url=https://khub.end.game/install.sh
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 20 "$url" -o /tmp/live.sh \
               && diff -q /tmp/live.sh install.sh >/dev/null; then
              echo "$url matches this commit"
              exit 0
            fi
            echo "attempt $attempt: not live yet, waiting"
            sleep 10
          done
          echo "::error::$url did not match install.sh after the deploy."
          diff -u /tmp/live.sh install.sh || true
          exit 1
