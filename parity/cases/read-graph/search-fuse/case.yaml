steps:
- argv: ["init", "build-hub", ".", "--no-wire"]
- argv: ["add", "component", "--title", "Auth flow overview", "--kind", "service", "--body", "Login, session and token refresh."]
- argv: ["add", "component", "--title", "Auth flow for admins", "--kind", "service", "--body", "Elevated checks before any admin page."]
- argv: ["add", "component", "--title", "Auth flow for the API", "--kind", "service", "--body", "Bearer tokens on every call."]
- argv: ["add", "component", "--title", "Billing", "--kind", "service", "--body", "Invoices and payment retries."]
- argv: ["add", "component", "--title", "Search index", "--kind", "service", "--body", "Nightly rebuild of the catalogue index."]
- argv: ["add", "component", "--title", "Notifier", "--kind", "service", "--body", "Email and push delivery."]
- argv: ["add", "adr", "--title", "Error catalogue", "--status", "accepted", "--body", "Every service answers a request it refuses with one of the catalogued errors. A rejected check in the auth flow raises ForbiddenError; a missing record raises NotFoundError; a malformed body raises ValidationError. Handlers map each error to a status code and log the request id."]
- argv: ["add", "adr", "--title", "Rate limiter", "--status", "accepted", "--body", "Token bucket per client key."]
- argv: ["add", "adr", "--title", "Use Postgres", "--status", "accepted", "--body", "One primary, two replicas."]
- argv: ["search", "auth OR flow OR ForbiddenError", "--format", "ids"]
- argv: ["search", "auth flow", "--also", "\"ForbiddenError\""]
- argv: ["search", "\"ForbiddenError\"", "--also", "auth flow"]
- argv: ["search", "auth flow", "--also", "\"ForbiddenError\"", "--limit", "2"]
- argv: ["search", "--plain", "auth flow", "--also", "forbidden"]
- argv: ["search", "auth flow", "--also", "\"ForbiddenError\"", "--format", "ids"]
- argv: ["search", "zzz", "--also", "yyy"]
- argv: ["search", "auth", "--also", "((("]
- argv: ["search", "auth", "--also", "auth"]
- argv: ["search", "auth"]
- argv: ["search", "auth flow", "--also", "\"ForbiddenError\"", "--type", "adr"]
