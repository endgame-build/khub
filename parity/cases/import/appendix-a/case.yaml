# The OKF 0.2 spec's Appendix A bundle (the v0.2 income statement, written
# from the spec text) imports into build-hub through a type map: Metric lands
# as a capability and Attested Computation as a requirement, each a draft with
# its frontmatter kept as written (flow mappings, nested `parameters`,
# `executor`, the OKF families), `type` rewritten, the OKF type kept as
# `okf_type`, `status: stable` forced to draft (`status_was`), and the
# bundle's `verified` kept as `okf_verified`, so every concept reads
# unverified. Ids follow build-hub's scheme (`cap-income-statement`,
# `req-revenue`), the stem kept in `aliases`, so `get capability/income-statement`
# still resolves. The income statement's two body links resolve to the
# imported computations and become `references` to their minted ids; the
# sources' URLs count as external. A skill file with no frontmatter is skipped
# (`no_frontmatter`) and a .py file is not a concept. A dry run plans the same
# and writes nothing; a second import reports every concept as `slug_taken`,
# naming the bundle file to rename, rather than merging or suffixing.
steps:
- argv: ["init", "build-hub", "hub", "--no-wire"]
- sh: |
    mkdir -p bundle/metrics
    cat > bundle/metrics/income-statement.md <<'CONCEPT'
    ---
    type: Metric
    title: Income statement (fiscal year)
    description: Headline income-statement figures for a fiscal year.
    tags: [finance, income-statement]
    status: stable
    generated: { by: reference_agent/gemini-2.5-pro, at: 2026-06-20T22:53:05Z }
    verified: { by: human:ahormati, at: 2026-06-25T09:00:00Z }
    stale_after: 2026-12-31T00:00:00Z
    sources:
      - id: fpa-handbook
        resource: https://wiki.acme/finance/fpa-handbook
        title: FP&A reporting handbook
    ---

    # Definition
    The income statement reports [revenue](../computations/revenue.md) and
    [gross profit](../computations/profit.md) for a fiscal year, per the FP&A
    reporting handbook.[^fpa-handbook] Each figure is produced by a sanctioned,
    attestable computation; this concept only narrates them.

    [^fpa-handbook]: FP&A reporting handbook
    CONCEPT
    mkdir -p bundle/computations
    cat > bundle/computations/revenue.md <<'CONCEPT'
    ---
    type: Attested Computation
    title: Revenue for fiscal year
    description: Recognized revenue for a fiscal year, per Finance's definition.
    tags: [finance, revenue]
    status: stable
    runtime: bigquery
    parameters:
      - { name: year, type: integer, required: true }
    executor:
      resource: references/skills/run-on-bq.md
      receipt: [job_id, executed_sql, result]
    attester:
      resource: references/attesters/sql-equality.py
    generated: { by: reference_agent/gemini-2.5-pro, at: 2026-06-28T14:00:00Z }
    verified: { by: human:ahormati, at: 2026-06-25T09:00:00Z }
    stale_after: 2026-12-31T00:00:00Z
    sources:
      - id: rev-policy
        resource: https://wiki.acme/finance/revenue-recognition
        title: Revenue recognition policy
        author: team:finance-fpa
        last_modified: 2026-04-02T00:00:00Z
      - id: exec-rev-dash
        resource: dashboards/exec-revenue
        title: Executive revenue dashboard
        author: team:finance-fpa
        usage_count: 5000
        last_modified: 2026-06-18T00:00:00Z
    usage_window: { from: 2026-06-01T00:00:00Z, to: 2026-06-30T00:00:00Z }
    ---

    # Computation

        SELECT SUM(amount) AS revenue
        FROM finance.recognized_revenue
        WHERE fiscal_year = @year

    Recognized revenue per the recognition policy,[^rev-policy] corroborated by
    the executive revenue dashboard.[^exec-rev-dash]

    [^rev-policy]: Revenue recognition policy
    [^exec-rev-dash]: Executive revenue dashboard
    CONCEPT
    mkdir -p bundle/computations
    cat > bundle/computations/profit.md <<'CONCEPT'
    ---
    type: Attested Computation
    title: Gross profit for fiscal year
    description: Gross profit by segment for a fiscal year, per the cost-allocation standard.
    tags: [finance, profit]
    status: stable
    runtime: dbt
    parameters:
      - { name: year, type: integer, required: true }
      - { name: segment, type: string, required: true }
    executor:
      resource: references/skills/run-dbt.md
      receipt: [run_id, compiled_sql, result]
    attester:
      resource: references/attesters/dbt-binding.py
    generated: { by: reference_agent/gemini-2.5-pro, at: 2026-06-14T14:00:00Z }
    verified: { by: process:finance-nightly, at: 2026-06-12T08:00:00Z }
    stale_after: 2026-06-15T00:00:00Z
    sources:
      - id: cost-alloc
        resource: https://wiki.acme/finance/cost-allocation
        title: Cost allocation standard
    ---

    # Computation

        SELECT gross_profit
        FROM {{ ref('fct_income_statement') }}
        WHERE fiscal_year = {{ var('year') }}
          AND segment = {{ var('segment') }}

    Gross profit by segment per the cost-allocation standard.[^cost-alloc]

    [^cost-alloc]: Cost allocation standard
    CONCEPT
    mkdir -p bundle/references/skills bundle/references/attesters
    printf -- '# Run on BigQuery\n\nSubmit the SQL as a job.\n' > bundle/references/skills/run-on-bq.md
    printf -- 'print(1)\n' > bundle/references/attesters/sql-equality.py
    printf -- 'Metric: capability\nAttested Computation: requirement\n' > typemap.yaml
- argv: ["-C", "hub", "import", "--okf", "bundle", "--type-map", "typemap.yaml", "--dry-run", "--format", "json"]
- argv: ["-C", "hub", "import", "--okf", "bundle", "--type-map", "typemap.yaml", "--format", "json"]
- argv: ["-C", "hub", "get", "capability/income-statement", "--format", "raw"]
- argv: ["-C", "hub", "get", "requirement/revenue", "--format", "raw"]
- argv: ["-C", "hub", "query", "--format", "json"]
- argv: ["-C", "hub", "import", "--okf", "bundle", "--type-map", "typemap.yaml", "--format", "json"]
