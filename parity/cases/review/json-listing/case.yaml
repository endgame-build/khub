# The JSON read lists every target with every applicable lens, each with its
# question hash and state, then the skipped paths: a path outside every
# entity, a deleted file, and an entity whose type has no lens (its template
# removed). A path given twice names its entity once.
steps:
- argv: ["init", "build-hub", ".", "--no-wire"]
- argv: ["add", "requirement", "--title", "Invoice totals", "--kind", "non-functional"]
- argv: ["add", "system", "--title", "Billing"]
- sh: "rm .khub/templates/system.yaml"
- argv: ["review"]
- argv: ["review", "--changed", "knowledge/requirements/req-invoice-totals.md", "knowledge/requirements/req-invoice-totals.md", "knowledge/systems/sys-billing.md", "knowledge/gone.md", "--format", "json"]
