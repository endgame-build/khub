[project]
name = "khub"
version = "0.6.0"
description = "khub — schema-bound, agent-facing context management."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "typer",
    "rich",
    "ruamel.yaml",
    "python-frontmatter",
    "networkx",
    "questionary>=2.1.1",
]

[project.scripts]
khub = "khub.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/khub"]

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, isolated unit tests (vocabulary, base-merge, mapping)",
    "integration: resolve flow, CRUD, graph, located errors",
    "e2e: full firm-ops scaffold + HQ snapshot validation",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/khub"]

[[tool.mypy.overrides]]
# Third-party modules without type stubs / py.typed markers.
module = ["yaml", "ruamel.*", "frontmatter", "networkx", "networkx.*"]
ignore_missing_imports = true
