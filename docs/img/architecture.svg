<svg xmlns="http://www.w3.org/2000/svg" viewBox="24 22 1300 382" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8792a2"/>
    </marker>
    <marker id="ahd" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#635bff"/>
    </marker>
  </defs>

  <!-- borderless canvas (Stripe-inspired #F6F9FC-neutral, readable on light + dark) -->
  <rect x="24" y="22" width="1300" height="382" fill="#ffffff"/>

  <!-- ================= eyebrow titles ================= -->
  <g fill="#425466" letter-spacing="1.5" font-weight="600">
    <text x="63" y="58" font-size="12">AGENTS</text>
    <text x="386" y="50" font-size="12">SCHEMA-BOUND GRAPH</text>
    <text x="1016" y="58" font-size="12">MULTIPLE STORAGE FORMATS</text>
  </g>
  <text x="386" y="66" font-size="10" fill="#8792a2" letter-spacing="1" font-weight="600">MULTIPLE PRESETS · CUSTOMIZABLE TO YOUR NEEDS</text>

  <!-- ================= panel 1 : agent ================= -->
  <rect x="48" y="78" width="190" height="310" fill="#eef1fe" stroke="#c7d2fe" stroke-width="1.25"/>
  <rect x="126" y="184" width="34" height="26" fill="#ffffff" stroke="#635bff" stroke-width="1.25"/>
  <text x="143" y="202" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#635bff">&gt;_</text>
  <text x="143" y="258" text-anchor="middle" font-size="22" font-weight="700" fill="#0a2540">Agent</text>
  <text x="143" y="283" text-anchor="middle" font-size="12" fill="#635bff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">CLI · MCP · Skill</text>

  <!-- ============ arrows 1 : agent <-> graph ============ -->
  <line x1="244" y1="218" x2="374" y2="218" stroke="#635bff" stroke-width="2" marker-end="url(#ahd)"/>
  <text x="309" y="207" text-anchor="middle" font-size="10.5" fill="#635bff" font-weight="500">capture · link · query</text>
  <line x1="372" y1="250" x2="244" y2="250" stroke="#8792a2" stroke-width="1.75" marker-end="url(#ah)"/>
  <text x="308" y="270" text-anchor="middle" font-size="10.5" fill="#425466" font-weight="500">search · traverse</text>

  <!-- ================= panel 2 : graph ================= -->
  <rect x="378" y="78" width="480" height="310" fill="#f6f9fc" stroke="#cfd7e3" stroke-width="1.25" stroke-dasharray="5 5"/>

  <!-- edges (under nodes) -->
  <g stroke="#8792a2" stroke-width="1.6" fill="none">
    <line x1="462" y1="172" x2="462" y2="238" marker-end="url(#ah)"/>   <!-- BizRule -> UseCase -->
    <line x1="524" y1="244" x2="576" y2="200" marker-end="url(#ah)"/>   <!-- UseCase -> Requirement -->
    <line x1="628" y1="278" x2="628" y2="204" marker-end="url(#ah)"/>   <!-- ADR -> Requirement -->
    <line x1="684" y1="188" x2="724" y2="222" marker-end="url(#ah)"/>   <!-- Requirement -> Component -->
  </g>
  <g font-size="11" font-style="italic" fill="#64708a">
    <text x="424" y="208" text-anchor="middle">constrains</text>
    <text x="540" y="214" text-anchor="middle">realizes</text>
    <text x="668" y="242" text-anchor="middle">addresses</text>
    <text x="712" y="190" text-anchor="middle">satisfies</text>
  </g>

  <!-- nodes -->
  <g font-size="14" font-weight="600" fill="#0a2540" text-anchor="middle">
    <rect x="406" y="128" width="112" height="44" fill="#ffffff" stroke="#e11d48" stroke-width="1.5"/>
    <text x="462" y="156">Business Rule</text>

    <rect x="403" y="240" width="118" height="44" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="462" y="268">Use Case</text>

    <rect x="574" y="158" width="108" height="44" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <text x="628" y="186">Requirement</text>

    <rect x="580" y="278" width="96" height="44" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <text x="628" y="306">ADR</text>

    <rect x="726" y="218" width="120" height="44" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="786" y="246">Component</text>
  </g>

  <!-- ============ arrows 2 : graph <-> storage ============ -->
  <line x1="864" y1="218" x2="994" y2="218" stroke="#635bff" stroke-width="2" marker-end="url(#ahd)"/>
  <text x="929" y="207" text-anchor="middle" font-size="10.5" fill="#635bff" font-weight="500">saved in git as</text>
  <line x1="992" y1="250" x2="864" y2="250" stroke="#8792a2" stroke-width="1.75" marker-end="url(#ah)"/>
  <text x="928" y="270" text-anchor="middle" font-size="10.5" fill="#425466" font-weight="500">indexed</text>

  <!-- ================= panel 3 : storage (folder tree) ================= -->
  <rect x="998" y="78" width="302" height="310" fill="#f6f9fc" stroke="#e3e8ee" stroke-width="1.25"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">
    <text x="1016" y="112" fill="#0a2540" font-weight="600">my-hub/</text>
    <text x="1016" y="142" fill="#0a2540">├─ adr/</text>
    <text x="1016" y="172" fill="#64708a">│   └─ 0001-postgres.md</text>
    <text x="1016" y="202" fill="#0a2540">├─ components/</text>
    <text x="1016" y="232" fill="#64708a">│   └─ api.md</text>
    <text x="1016" y="262" fill="#0a2540">├─ use-cases/</text>
    <text x="1016" y="292" fill="#64708a">│   └─ uc-12.md</text>
    <text x="1016" y="322" fill="#0a2540">├─ requirements.jsonl</text>
    <text x="1016" y="352" fill="#0a2540">└─ business-rules.yaml</text>
  </g>
  <!-- pills : layout · format, aligned right on each type line -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" text-anchor="middle">
    <rect x="1212" y="128" width="72" height="18" fill="#e6edff"/><text x="1248" y="141" fill="#3538cd">folder·md</text>
    <rect x="1212" y="188" width="72" height="18" fill="#e6edff"/><text x="1248" y="201" fill="#3538cd">folder·md</text>
    <rect x="1212" y="248" width="72" height="18" fill="#e6edff"/><text x="1248" y="261" fill="#3538cd">folder·md</text>
    <rect x="1210" y="308" width="74" height="18" fill="#f3e8ff"/><text x="1247" y="321" fill="#6b21a8">coll·jsonl</text>
    <rect x="1212" y="338" width="72" height="18" fill="#d1fae5"/><text x="1248" y="351" fill="#047857">coll·yaml</text>
  </g>
</svg>
