# Sections 1-12 are arc42's, spelled as docs.arc42.org spells them, so an
# arc42-literate reader navigates blind and a record from other arc42 tooling drops
# in unchanged. Do not localise them. The four after Glossary are not arc42; they are
# what a gated workflow hangs off the spine, and they sit there because that is where
# such a workflow writes them — a declared heading matched out of order is what makes
# an unrelated required section report missing.
#
# BREAKING with the kb 0.14.0 port: matching is a case-sensitive prefix, so an arc42
# written against the earlier template fails `body_shape` after `khub upgrade` until
# its headings are renamed. CHANGELOG carries the map.
#
# Required are the six that carried the contract before this port. Everything added
# since is `optional: true` — the standing rule for a section a type gains after it
# ships.
#
# `Data model` is deliberately absent: arc42 has no section for it — the domain data
# model goes under Crosscutting Concepts (tip 8-7). Do not re-add it as a heading.

title: Architecture
sections:
- heading: Introduction and Goals
  optional: true
  hint: what this system is for, and the one or two decisions that matter most
- heading: Architecture Constraints
  optional: true
  hint: forces from outside the design space - platform, budget, org boundary, compliance
- heading: Context and Scope
  hint: the system boundary - the systems and people outside it, named, and what crosses the line
- heading: Solution Strategy
  hint: the shape and why - one paragraph per big call, each stating the choice and its cost; a pinned stack, with versions, earns a table here
- heading: Building Block View
  hint: each part by name and what it owns, one line each; the diagram below carries the direction
  # The one diagram nothing else can carry: which way the dependencies point. The
  # component graph knows the edges, but not what a reader should conclude from them.
  code_blocks: [{lang: mermaid, min: 1}]
- heading: Runtime View
  optional: true
  hint: only the interactions a quality target stresses - a numbered walk or a sequence, at component altitude
- heading: Deployment View
  optional: true
  hint: the runtime nodes and environments, and the structural reason they are separate
- heading: Crosscutting Concepts
  hint: auth, errors, logging, config, naming - the rules that hold everywhere; the domain data model belongs here too, as an ERD
- heading: Architecture Decisions
  hint: one line per decision - what was chosen and why it still holds; full records in knowledge/decisions/
- heading: Quality Requirements
  optional: true
  hint: the measurable targets - a number, a unit, and the point it is measured at
- heading: Risks and Technical Debt
- heading: Glossary
  optional: true
  hint: the ubiquitous language - term, one line each

# The appendices below are not arc42. They are what a gated workflow hangs off the
# spine, declared so one template covers both readers, and optional so a corpus
# without a gate owes none of them. They stay after Glossary: that is where a
# workflow that writes them puts them, and a declared heading matched out of order
# is what makes an unrelated required section report missing.
- heading: Deferred Decisions
  optional: true
  hint: decisions pushed down on purpose, each with the event that reopens it
- heading: Open Questions
  optional: true
  hint: what only a human can settle, each with who answers it and what it blocks
- heading: Assumptions Index
  optional: true
  hint: every assumption this record proceeds on, and the consequence if it is wrong
- heading: Grounding Evidence
  optional: true
  hint: the audit appendix - what was read to write this, and when

lenses:
- code: direction
  name: Which way the arrows point
  section: Building Block View
  instruction: |
    Read the diagram as a stranger would: can they tell what depends on what, and what
    would break in which direction? A box-and-line picture with no direction is a
    seating chart. Check it against the `depends_on` edges — where the prose and the
    graph disagree, one of them is out of date.
- code: deferred
  name: Deferred, with a reason it can wait
  section: Deferred Decisions
  after: direction
  instruction: |
    Each deferred item should say what would force it back onto the table. "Later"
    without a trigger is how a spine quietly rots — nobody ever notices the moment it
    stopped being safe to wait.
