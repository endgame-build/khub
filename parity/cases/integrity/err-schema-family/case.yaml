steps:
- argv: ["init", "build-lite", ".", "--no-wire"]
- sh: "rm .khub/policy.yaml .khub/storage.yaml && printf \"ontology:\\n  entities:\\n    ghost:\\n      relations:\\n        to_missing: {to: nowhere}\\n\" > .khub/ontology.yaml"
- argv: ["status"]
- sh: "printf \"ontology:\\n  entities:\\n    x: {sneaky_construct: 1}\\n\" > .khub/ontology.yaml"
- argv: ["status"]
- sh: "printf \"{{{{not yaml\" > .khub/ontology.yaml"
- argv: ["status"]
- sh: "rm .khub/ontology.yaml"
- argv: ["status"]
- sh: "printf \"ontology:\\n  base: {}\\n  entities:\\n    x: {}\\n\" > .khub/ontology.yaml"
- argv: ["status"]
- sh: "printf \"entities:\\n  x: {}\\n\" > .khub/ontology.yaml"
- argv: ["status"]
- sh: "printf \"policy: {}\\n\" > .khub/policy.yaml && rm .khub/ontology.yaml"
- argv: ["status"]
