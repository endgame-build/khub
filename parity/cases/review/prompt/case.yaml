# khub review as a prompt and as JSON. An explicit --format text prints the
# prompt on a pipe too; --changed reviews only the entities at the paths, and
# a path that names no entity is skipped. Without --changed the JSON lists
# every active entity with an applicable lens, each lens with q and state.
steps:
- argv: ["init", "build-hub", ".", "--no-wire"]
- argv: ["add", "requirement", "--title", "Invoice totals", "--kind", "non-functional"]
- argv: ["review", "--changed", "knowledge/requirements/req-invoice-totals.md", "README.md", "--format", "text"]
- argv: ["review", "--format", "json"]
