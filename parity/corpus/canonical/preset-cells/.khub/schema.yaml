# khub-preset: preset-cells@0.1.0
base:
  attributes:
    type:
      type: text
      required: true
    draft:
      type: bool
      default: false
    author:
      type: text
    created:
      type: date
      required: true
    updated:
      type: date
    title:
      type: text
    description:
      type: text
    resource:
      type: text
    tags:
      type: list
  relations:
    related:
      to: any
      many: true
    sources:
      to: any
      many: true
    references:
      to: any
      many: true
    depends_on:
      to: any
      many: true
      acyclic: true
entities:
  note:
    layout: file
    path: notes
    when: parity corpus
    attributes:
      title:
        required: true
  card:
    layout: file
    format: json
    path: cards
    when: parity corpus
    attributes:
      title:
        required: true
  sheet:
    layout: file
    format: yaml
    path: sheets
    when: parity corpus
    attributes:
      title:
        required: true
  dossier:
    layout: folder
    path: dossiers
    when: parity corpus
    attributes:
      title:
        required: true
  charter:
    layout: singleton
    path: charter.md
    orphan: true
    when: parity corpus
    attributes:
      title:
        required: true
  repo:
    layout: collection
    format: jsonl
    path: repos.jsonl
    when: parity corpus
    attributes:
      title:
        required: true
      stack:
        type: text
  vendor:
    layout: collection
    format: yaml
    path: vendors.yaml
    when: parity corpus
    attributes:
      title:
        required: true
  account:
    layout: collection
    format: json
    path: accounts.json
    when: parity corpus
    attributes:
      title:
        required: true
      amount:
        type: number
      due:
        type: date
