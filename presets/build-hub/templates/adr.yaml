# The three original headings stay required; everything added since is `optional:
# true`, so upgrading a corpus written against an earlier khub never turns a passing
# `check` into a failing one.

title: Architecture decision
sections:
- heading: Context
  hint: the forces; the constraint requirements (req- slugs) that bind this
  word_count: {min: 25}
- heading: Alternatives
  optional: true
  hint: what else was on the table, and what each would have cost — including doing nothing
- heading: Decision
  hint: one paragraph, active voice
  word_count: {min: 15}
  # A decision that has not been taken is a proposal. `status: proposed` is how a
  # record says so; hedging inside the Decision section says it by accident.
  forbidden_text:
  - {pattern: '\b(tbd|to be decided|we should consider|still deciding)\b'}
- heading: Consequences
  hint: what gets easier, what gets harder; what this forecloses
  word_count: {min: 20}
- heading: Prevents
  optional: true
  hint: the divergence this stops — what someone would otherwise reasonably have done

lenses:
- code: alternatives
  name: A real alternative, not a strawman
  instruction: |
    A decision with one option on the table is a description, not a decision. Name
    what else was genuinely considered and what it would have cost. If there was only
    ever one option, say that and say why — that is a constraint, and it belongs in
    Context.
- code: consequences
  name: The cost, not only the benefit
  after: alternatives
  instruction: |
    Consequences that are all upside means the tradeoff has not been found yet. What
    got harder? What can no longer be done cheaply? A reader six months from now is
    here because something is painful and they want to know whether this record
    predicted it.
- code: reversal
  name: What would reverse this
  after: consequences
  instruction: |
    Name the observation that would make this the wrong call. Without it, nobody
    knows when to open a superseding record — and `supersedes` is the edge that makes
    the history readable.
- code: rule
  name: A rule needs a requirement
  after: reversal
  instruction: |
    If this decision creates something the system must always or never do, that is a
    `requirement`, not a paragraph here. Add it and link it — `affects` carries the
    blast radius, and a rule buried in an ADR body is a rule nothing can check.
- code: proposed
  name: Still proposed
  when: {status: proposed}
  after: rule
  instruction: |
    This record is not decided yet. Confirm the Decision section reads as the
    proposal it is, and that whoever has to accept or reject it can tell what they
    are being asked.
