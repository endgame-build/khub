[project]
name = "khub"
version = "0.8.0"
description = "khub — schema-bound, agent-facing context management."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ilya Pukhalski", email = "ilya@pukhalski.com" }]
keywords = ["knowledge-graph", "agents", "schema", "markdown", "cli", "context-management", "okf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2",
    "typer",
    "rich",
    "ruamel.yaml",
    "python-frontmatter",
    "networkx",
    "questionary>=2.1.1",
]

[project.scripts]
khub = "khub.cli.main:main"

[project.urls]
Homepage = "https://github.com/endgame-build/khub"
Repository = "https://github.com/endgame-build/khub"
Documentation = "https://github.com/endgame-build/khub/tree/main/docs"
Changelog = "https://github.com/endgame-build/khub/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/khub"]

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, isolated unit tests (vocabulary, base-merge, mapping)",
    "integration: resolve flow, CRUD, graph, located errors",
    "e2e: full firm-ops scaffold + HQ snapshot validation",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/khub"]

[[tool.mypy.overrides]]
# Third-party modules without type stubs / py.typed markers.
module = ["yaml", "ruamel.*", "frontmatter", "networkx", "networkx.*"]
ignore_missing_imports = true
