name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes. Grants are per job, from a root that grants nothing, so
# a new job starts with no token scope rather than inheriting the repo default.
permissions: {}

# khub is a Go binary. The Python implementation and its `check` job (ruff,
# mypy, pytest, the Typer doc generator, the wheel build) were retired at
# cutover; every gate they held is now held by a step below.
jobs:
  go:
    permissions:
      contents: read
    # darwin is where khub is actually used, and until the cutover nothing but a
    # laptop asserted it: every gate ran on linux only. The port touches file
    # locking, path handling and terminal detection, which are exactly the three
    # things that differ between the two — so both run every gate, and neither is
    # allowed to cancel the other's evidence.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Local paths, agent session links and private registry references do
      # not ship. Plain ERE only: `\b` is a glibc extension that macOS git
      # evaluates as a literal, so the two runners would disagree.
      - name: No internal names ship
        run: |
          ! git grep -nIiE 'claude\.ai/code/session|/Users/|~/Sites|npm\.pkg\.github\.com|orgs/endgame-build' -- . ':!.github/workflows/ci.yml'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./parity)
          test -z "$unformatted" || { echo "gofmt needed on:"; echo "$unformatted"; exit 1; }
      - run: go vet ./...
      # None of the three below is platform-dependent, and the matrix exists
      # to test file locking, path handling and terminal detection — not to
      # query a vulnerability database twice.
      - name: go.mod is tidy
        if: matrix.os == 'ubuntu-latest'
        run: go mod tidy -diff
      # Pinned, per .claude/rules/dependencies.md. Call-graph reachability, so
      # it reports what khub actually calls rather than everything in go.sum —
      # which is why it is preferred to an SBOM. Note go-version above
      # floats across 1.25 PATCHES deliberately: a stdlib advisory is fixed by
      # picking up the patch release, and pinning it exactly would opt out.
      - name: govulncheck
        if: matrix.os == 'ubuntu-latest'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      # The workflows are the third thing CI depends on, after the code and the
      # packaging scripts, and nothing checked them. Lives here rather than in
      # npm-package because that job has no Go toolchain — `go run` there would
      # silently use whatever Go the runner ships. actionlint also runs
      # shellcheck over every `run:` block.
      - name: actionlint
        if: matrix.os == 'ubuntu-latest'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Choke-point lint (only internal/canon may import a YAML library)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned, not `latest`: a linter release could turn the tree red
          # with no commit of ours, and the choke-point rules are a gate.
          version: "v2.13.2"
      - run: go test ./...
      - name: Build
        run: |
          go build -o khub ./cmd/khub
          go build -o parity-run ./parity/runner
      # The recorded bytes are the spec. Before the cutover they described
      # Python and this step proved the port grew into them; now they describe
      # khub itself and the same run is the regression suite.
      #
      # UNAIDED: no -setup-bin, no -ported. Every verb is implemented, so the
      # binary runs every step of every fixture itself.
      - name: Every fixture passes, unaided
        run: ./parity-run -bin "$PWD/khub" -cases parity/cases
      # Appendix A: every command, flag, error code, format special, and mode
      # must map to at least one recorded fixture. Fails on any gap.
      - name: Coverage gate
        run: |
          # -subset-of also asserts the binary offers no command the coverage
          # table does not know about (cobra ships `completion` by default).
          ./parity-run -coverage parity/coverage.yaml -cases parity/cases -subset-of "$PWD/khub"
      # The fixtures prove the core; this proves the binary end to end — every
      # command over both build presets, with exit codes asserted.
      - name: CLI smoke
        run: bash smoke.sh
      # Replaces the Typer doc generator, which read the Python app's
      # decorators. This regenerates from what the binary prints, so the
      # reference cannot advertise a flag the CLI does not have.
      - name: CLI reference is current
        run: |
          bash parity/tools/gen_cli_reference.sh
          git diff --exit-code docs/cli-reference.md
      # The M0 YAML gate is a standing regression, not a one-off: the emitter
      # must keep reproducing ruamel byte-for-byte, because that is khub's
      # on-disk format and not an artifact of the retired implementation.
      # Both legs assert real numbers: a mis-pathed corpus (0 files) or any
      # diff fails.
      - name: YAML round-trip gate
        shell: bash
        run: |
          set -euo pipefail
          go build -o yamlgate ./parity/yamlgate
          ./yamlgate parity/corpus | tee gate.txt
          files=$(sed -n 's/^files: //p' gate.txt)
          test "$files" -ge 130 || { echo "corpus shrank to $files files"; exit 1; }
          grep -qE "^t1c: ok=$files diff=0 error=0 skip=0$" gate.txt
          grep -qE "^t2: ok=[0-9]+ diff=0 error=0" gate.txt
          emit=$(go run ./parity/yamlgate/emit | tail -1)
          echo "$emit"
          # "T3: rt N/M  safe P/Q" — every case must pass on both profiles.
          read -r rt_ok rt_all safe_ok safe_all \
            <<<"$(echo "$emit" | tr '/' ' ' | awk '{print $3, $4, $6, $7}')"
          # Fail closed on anything unparsed. `read` leaves the vars empty
          # rather than erroring, so without this an emit line that stopped
          # matching would make every comparison below vacuous and the gate
          # would go green on output it does not recognise.
          case "$rt_ok$rt_all$safe_ok$safe_all" in
            ''|*[!0-9]*) echo "T3 unparsed: $emit"; exit 1 ;;
          esac
          if [ "$rt_ok" != "$rt_all" ] || [ "$safe_ok" != "$safe_all" ] \
            || [ "$rt_ok" -lt 1000 ]; then
            echo "T3 regression: $emit"
            exit 1
          fi

  # The npm package is khub's only distribution channel. This job lints the
  # scripts that assemble it and smoke-tests the result end to end.
  npm-package:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck npm/build-packages.sh npm/smoke.sh
      - name: POSIX sh syntax
        run: |
          sh -n npm/build-packages.sh
          sh -n npm/smoke.sh
      - name: Browser model tests
        run: node --test internal/serve/tests/*.test.mjs
      - name: Launcher shim parses
        run: node --check npm/khub/bin/khub.js
      # The real package is assembled from goreleaser artifacts on a tag
      # (release.yml). npm/smoke.sh proves the assembler itself on every PR,
      # over fixture tarballs. It lives in a file, not inline here, so it is
      # runnable locally and covered by the shellcheck step above.
      - name: Assembly smoke over fixture tarballs
        run: npm/smoke.sh

  # The Claude Code plugin under plugin/, and the marketplace manifest at the root.
  # Neither command needs credentials or the network once Claude Code is installed.
  plugin:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # Pinned: the mod API is early access and moves between releases.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.291
      - name: shellcheck
        run: shellcheck plugin/tools/*.sh
      - name: Marketplace manifest
        run: claude plugin validate --strict .
      - name: Plugin manifest and hooks
        run: claude plugin validate --strict plugin
      # The fixtures are khub's real output. A JSON shape that moved shows as a diff.
      - name: Fixtures match the built binary
        run: |
          bash plugin/tools/record-fixtures.sh
          git diff --exit-code plugin/tests/fixtures.ts
      - name: Plugin tests
        run: claude plugin test plugin
