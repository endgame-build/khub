# The three headings are the ones this type shipped with and stay required. No word
# bound on Statement: a requirement is one sentence, and a minimum would fire on a
# correct one. NFRs are quality-attribute entities in this preset, so no lens here
# reads `kind: non-functional` — the enum does not carry it.

title: Requirement
sections:
- heading: Statement
  hint: one statement, in the present tense, of what must hold. EARS reads well - "When <trigger>, the system shall <response>"; say what is measured and what enforces it
- heading: Acceptance criteria
  hint: observable from outside - a request, a response, a number
- heading: Notes

lenses:
- code: single
  name: One statement
  instruction: |
    Does the Statement say exactly one thing? An "and", a bulleted list of behaviours,
    or two sentences each with their own verb mean this is two requirements. Split it —
    two records each with their own edges are worth more than one that cannot be
    satisfied or violated as a unit.
- code: testable
  name: Observable from outside
  after: single
  instruction: |
    Could someone who did not write this tell whether the system satisfies it, without
    reading the implementation? If the only way to check is to open the code, this is
    describing a design, not stating a requirement.
- code: violation
  name: What violating it looks like
  when: {kind: constraint}
  after: testable
  instruction: |
    A constraint is a rule the system must never break, so the useful question is what
    breaking it would look like from outside. If that cannot be described, this is
    probably a preference — and a preference belongs in an `adr`, with its reasoning.
- code: realized
  name: Where it is satisfied
  after: testable
  instruction: |
    A feature-spec binding this requirement through `requirements` is how it gets
    built; `realized_in` is the stored backstop naming the repo where it already holds
    outside the work spine. A requirement with neither is unfinished by design. If
    nothing satisfies it yet, that is the honest answer and the gap is the point — but
    check that it is not simply unlinked.
