[project]
name = "khub"
version = "0.5.0"
description = "khub — schema-bound, agent-facing context management."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "typer",
    "rich",
    "ruamel.yaml",
    "python-frontmatter",
    "networkx",
    "questionary>=2.1.1",
]

[project.optional-dependencies]
# LinkML is compile-time only (`khub compile`); no runtime path imports it or its
# generated artifacts. Quarantined as an extra so a default install skips its
# ~77-package tail — `khub compile` asks for `khub[compile]` when absent.
# Pinned exactly: determinism (TS-SCH-003-04) needs a fixed generator.
compile = [
    "linkml==1.11.1",
    "linkml-runtime==1.11.1",
]

[project.scripts]
khub = "khub.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/khub"]

[dependency-groups]
# Dev keeps the compile extra installed so the compile/emit tests always run;
# the pins mirror [project.optional-dependencies].compile exactly.
dev = ["pytest", "ruff", "mypy", "linkml==1.11.1", "linkml-runtime==1.11.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, isolated unit tests (vocabulary, base-merge, mapping)",
    "integration: resolve -> compile flow, generated artifacts, located errors",
    "e2e: full firm-ops compile + HQ snapshot validation",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/khub"]

[[tool.mypy.overrides]]
# Third-party modules without type stubs / py.typed markers.
module = ["yaml", "linkml.*", "linkml_runtime.*", "ruamel.*", "frontmatter", "networkx", "networkx.*"]
ignore_missing_imports = true
