# A fail verdict with a note records state fail, and check --require-lenses
# fails the gate on it, with and without --changed. A later pass for the same
# lens wins: the last event decides.
steps:
- argv: ["init", "build-hub", ".", "--no-wire"]
- argv: ["add", "requirement", "--title", "Invoice totals", "--kind", "non-functional"]
- argv: ["review", "--record", "-", "--by", "human:ana"]
  stdin: '{"verdicts": [{"id": "req-invoice-totals", "lens": "measurable", "rev": "15dfd18b9df0", "verdict": "fail", "note": "No number: say the bound and where it is measured."}]}'
- argv: ["get", "req-invoice-totals", "--format", "raw"]
- argv: ["review", "--changed", "knowledge/requirements/req-invoice-totals.md"]
- argv: ["check", "--require-lenses", "--changed", "knowledge/requirements/req-invoice-totals.md"]
- argv: ["check", "--require-lenses"]
- argv: ["review", "--record", "-", "--by", "human:ana"]
  stdin: '{"verdicts": [{"id": "req-invoice-totals", "lens": "measurable", "rev": "15dfd18b9df0", "verdict": "pass"}]}'
- argv: ["review", "--changed", "knowledge/requirements/req-invoice-totals.md"]
