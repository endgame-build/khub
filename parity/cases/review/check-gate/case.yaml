# check --require-lenses adds a `lenses` bucket over the active entities (the
# draft is left out) and fails on it; --changed limits it to the entities at
# those paths, and a path that names no entity is ignored. Without the flag
# check's output and exit code are what they were: no bucket, the same gate.
# --changed without --require-lenses is a usage error.
steps:
- argv: ["init", "build-hub", ".", "--no-wire"]
- argv: ["add", "requirement", "--title", "Invoice totals", "--kind", "non-functional"]
- argv: ["add", "requirement", "--title", "Billing export", "--kind", "functional", "--draft"]
- argv: ["check"]
- argv: ["check", "--require-lenses"]
- argv: ["check", "--require-lenses", "--changed", "knowledge/requirements/req-billing-export.md", "README.md"]
- argv: ["check", "--require-lenses", "--changed"]
- argv: ["check", "--require-lenses", "--changed", "knowledge/requirements/req-invoice-totals.md"]
- argv: ["review", "--record", "-", "--by", "human:ana"]
  stdin: '{"verdicts": [{"id": "req-invoice-totals", "lens": "single", "rev": "15dfd18b9df0", "verdict": "pass"}]}'
- argv: ["check"]
- argv: ["check", "--changed", "knowledge/requirements/req-invoice-totals.md"]
- argv: ["check", "extra"]
