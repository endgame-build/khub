name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run mypy
      - run: uv run pytest
      - name: CLI reference is current
        run: |
          uv run typer --app app khub.cli.main utils docs --name khub --output docs/cli-reference.md
          git diff --exit-code docs/cli-reference.md
      # The suite cannot catch this: `skills_dir()` falls back to the repo's
      # skills/ in a dev checkout, so a broken force-include leaves every test
      # green while the built wheel ships without skills. Only a build shows it.
      - name: Wheel carries the skills
        run: |
          uv build
          python3 -c "
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()
          for want in ('khub/skills/khub/SKILL.md', 'khub/skills/setup/SKILL.md'):
              assert want in names, f'{want} missing from wheel'
          print('wheel carries both skills')"
