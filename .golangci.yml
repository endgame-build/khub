# Two kinds of rule live here. The choke-point rules from docs/history/go-port-plan.md:
# the serialization canon is the only place bytes are shaped, so only
# internal/canon may reach for a YAML library, and only internal/canon/jsonio.go
# writes JSON bytes (khub emits three JSON dialects and encoding/json matches
# none of them; ojson.go decodes through it, which is fine). And the curated
# general set .claude/rules/go.md argues for: staticcheck minus ST1005 (error
# text is product here, capitalised Click-style, and a fixture pins it),
# errorlint, unused and errcheck. golangci v2 runs its default set unless told
# otherwise, so `default: none` keeps the set exactly this list — broadening it
# is a deliberate decision, not a side effect.
version: "2"

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - errorlint
    - staticcheck
    - unused
  settings:
    staticcheck:
      checks:
        - all
        - -ST1005 # error strings are pinned prose, capitalised on purpose
    depguard:
      rules:
        yaml-choke-point:
          list-mode: lax
          files:
            - "!**/internal/canon/*.go"
            - "!**/parity/yamlgate/**"
            - "!**/parity/runner/*.go"
          deny:
            - pkg: github.com/goccy/go-yaml
              desc: "only internal/canon may import a YAML library (go-port-plan choke-point rule)"
            - pkg: gopkg.in/yaml.v2
              desc: "only internal/canon may import a YAML library (go-port-plan choke-point rule)"
            - pkg: gopkg.in/yaml.v3
              desc: "only internal/canon may import a YAML library (go-port-plan choke-point rule)"
            - pkg: go.yaml.in/yaml
              desc: "only internal/canon may import a YAML library (go-port-plan choke-point rule)"
            - pkg: sigs.k8s.io/yaml
              desc: "only internal/canon may import a YAML library (go-port-plan choke-point rule)"
        json-choke-point:
          list-mode: lax
          files:
            - "**/internal/**"
            - "**/cmd/**"
            - "!**/internal/canon/jsonio.go"
            - "!**/internal/canon/ojson.go"
            - "!**/*_test.go"
          deny:
            - pkg: encoding/json
              desc: "only internal/canon/jsonio.go writes JSON bytes and only ojson.go decodes them (CLAUDE.md choke-point rule); use canon.EncodeCLI/EncodeDisk or canon's decoders"
  exclusions:
    presets:
      - std-error-handling

issues:
  # Report everything: the defaults (50 per linter, 3 per message) hide the
  # tail of a fresh linter's findings and make a green run mean less.
  max-issues-per-linter: 0
  max-same-issues: 0
