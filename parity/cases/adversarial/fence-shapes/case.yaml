# Five fence shapes in one layout directory. A fenceless .md and an
# unterminated fence are strays (python-frontmatter: no fence, or one that
# never closes, is empty metadata and the whole text as body — never an
# error). A closed fence over YAML that does not parse is malformed. An empty
# body and trailing whitespace after a scalar are entities that read back
# canonically, and an edit of each splices without touching the rest.
steps:
- argv: ["init", "firm-ops", ".", "--no-wire"]
- sh: "mkdir -p fragments && printf 'loose notes, not an entity\\n' > fragments/no-fence.md && printf -- '---\\ntype: fragment\\nunclosed: [\\n' > fragments/unterminated.md && printf -- '---\\ntype: fragment\\nunclosed: [\\n---\\nbody\\n' > fragments/malformed.md && printf -- '---\\ntype: fragment\\ncreated: 2026-01-15\\nname: empty body\\n---\\n' > fragments/empty-body.md && printf -- '---\\ntype: fragment\\ncreated: 2026-01-15\\nname: trailing   \\n---\\nbody\\n' > fragments/trailing-ws.md"
- argv: ["status", "--format", "json"]
- argv: ["check", "--format", "json"]
- argv: ["query", "--type", "fragment", "--format", "json"]
- argv: ["edit", "fragment/empty-body", "stage", "raw", "--format", "json"]
- argv: ["get", "fragment/empty-body", "--format", "raw"]
- argv: ["edit", "fragment/trailing-ws", "stage", "raw", "--format", "json"]
- argv: ["get", "fragment/trailing-ws", "--format", "raw"]
