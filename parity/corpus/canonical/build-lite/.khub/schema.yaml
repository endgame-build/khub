# khub-preset: build-lite@0.1.0
base:
  attributes:
    type:
      type: text
      required: true
    draft:
      type: bool
      default: false
    author:
      type: text
    created:
      type: date
      required: true
    updated:
      type: date
    title:
      type: text
    description:
      type: text
    resource:
      type: text
    tags:
      type: list
  relations:
    related:
      to: any
      many: true
    sources:
      to: any
      many: true
    references:
      to: any
      many: true
    depends_on:
      to: any
      many: true
      acyclic: true
entities:
  prd:
    layout: singleton
    path: knowledge/prd.md
    required: true
    orphan: true
    when: someone states what the product is for, who it serves, or what is deliberately out of scope — edit [knowledge/prd.md](knowledge/prd.md), never add a second
    attributes:
      title:
        required: true
  arc42:
    layout: singleton
    path: knowledge/arc42.md
    orphan: true
    when: the shape of the system is described or changes — context, building blocks, data model, a crosscutting concern — edit [knowledge/arc42.md](knowledge/arc42.md)
    attributes:
      title:
        required: true
  requirement:
    layout: file
    path: knowledge/requirements
    id_prefix:
      by: kind
      map:
        functional: fr
        constraint: cst
        business-rule: br
    when: a rule is stated that the system must satisfy or must never violate. "must", "never", "always", "policy", "has to" are the tells; a stated invariant is a record, not a reply
    attributes:
      title:
        required: true
      kind:
        enum:
        - functional
        - constraint
        - business-rule
        required: true
    relations:
      realized_in:
        to: component
        many: true
  adr:
    layout: file
    path: knowledge/decisions
    id_prefix: ad
    when: a choice is made, rejected, or revisited between real alternatives — including "we considered X and are not doing it". Capture the reasoning while it is still known
    attributes:
      title:
        required: true
      status:
        enum:
        - proposed
        - accepted
        - rejected
        required: true
    relations:
      supersedes:
        to: adr
        inverse: superseded
        acyclic: true
      affects:
        to: any
        many: true
  component:
    layout: file
    path: knowledge/components
    id_prefix: cmp
    when: a part of the system is named as a thing that can break, be owned, or be swapped — a service, a library of ours, or a vendor dependency we sit on
    attributes:
      title:
        required: true
      kind:
        enum:
        - service
        - library
        - external
        required: true
      stack:
        type: text
      repo:
        type: text
  feature-spec:
    layout: file
    path: specs
    id_prefix: fs
    when: work is proposed, started, finished, or dropped. Record it when it is proposed, then edit `status` as it moves — do not wait until it is done
    attributes:
      title:
        required: true
      status:
        enum:
        - planned
        - active
        - done
        - dropped
        required: true
    relations:
      requirements:
        to: requirement
        many: true
      supersedes:
        to: feature-spec
        inverse: superseded
        acyclic: true
