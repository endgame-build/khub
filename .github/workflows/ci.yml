name: CI

on:
  push:
    branches: [main]
  pull_request:

# khub is a Go binary. The Python implementation and its `check` job (ruff,
# mypy, pytest, the Typer doc generator, the wheel build) were retired at
# cutover; every gate they held is now held by a step below.
jobs:
  go:
    # darwin is where khub is actually used, and until the cutover nothing but a
    # laptop asserted it: every gate ran on linux only. The port touches file
    # locking, path handling and terminal detection, which are exactly the three
    # things that differ between the two — so both run every gate, and neither is
    # allowed to cancel the other's evidence.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./parity)
          test -z "$unformatted" || { echo "gofmt needed on:"; echo "$unformatted"; exit 1; }
      - run: go vet ./...
      - name: Choke-point lint (only internal/canon may import a YAML library)
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, not `latest`: a linter release could turn the tree red
          # with no commit of ours, and the choke-point rules are a gate.
          version: "v2.13.2"
      - run: go test ./...
      - name: Build
        run: |
          go build -o khub ./cmd/khub
          go build -o parity-run ./parity/runner
      # The recorded bytes are the spec. Before the cutover they described
      # Python and this step proved the port grew into them; now they describe
      # khub itself and the same run is the regression suite.
      #
      # UNAIDED: no -setup-bin, no -ported. Every verb is implemented, so the
      # binary runs every step of every fixture itself.
      - name: Every fixture passes, unaided
        run: ./parity-run -bin "$PWD/khub" -cases parity/cases
      # Appendix A: every command, flag, error code, format special, and mode
      # must map to at least one recorded fixture. Fails on any gap.
      - name: Coverage gate
        run: |
          # -subset-of also asserts the binary offers no command the coverage
          # table does not know about (cobra ships `completion` by default).
          ./parity-run -coverage parity/coverage.yaml -cases parity/cases -subset-of "$PWD/khub"
      # The fixtures prove the core; this proves the binary end to end — every
      # command over both build presets, with exit codes asserted.
      - name: CLI smoke
        run: bash smoke.sh
      # Replaces the Typer doc generator, which read the Python app's
      # decorators. This regenerates from what the binary prints, so the
      # reference cannot advertise a flag the CLI does not have.
      - name: CLI reference is current
        run: |
          bash parity/tools/gen_cli_reference.sh
          git diff --exit-code docs/cli-reference.md
      # The M0 YAML gate is a standing regression, not a one-off: the emitter
      # must keep reproducing ruamel byte-for-byte, because that is khub's
      # on-disk format and not an artifact of the retired implementation.
      # Both legs assert real numbers: a mis-pathed corpus (0 files) or any
      # diff fails.
      - name: YAML round-trip gate
        shell: bash
        run: |
          set -euo pipefail
          go build -o yamlgate ./parity/yamlgate
          ./yamlgate parity/corpus | tee gate.txt
          files=$(sed -n 's/^files: //p' gate.txt)
          test "$files" -ge 130 || { echo "corpus shrank to $files files"; exit 1; }
          grep -qE "^t1c: ok=$files diff=0 error=0 skip=0$" gate.txt
          grep -qE "^t2: ok=[0-9]+ diff=0 error=0" gate.txt
          emit=$(go run ./parity/yamlgate/emit | tail -1)
          echo "$emit"
          # "T3: rt N/M  safe P/Q" — every case must pass on both profiles.
          set -- $(echo "$emit" | tr '/' ' ' | awk '{print $3, $4, $6, $7}')
          test "$1" = "$2" && test "$3" = "$4" && test "$1" -ge 1000 \
            || { echo "T3 regression: $emit"; exit 1; }

  # The npm package is khub's only distribution channel. This job lints the
  # scripts that assemble it and smoke-tests the result end to end.
  npm-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck npm/build-packages.sh npm/smoke.sh
      - name: POSIX sh syntax
        run: |
          sh -n npm/build-packages.sh
          sh -n npm/smoke.sh
      - name: Launcher shim parses
        run: node --check npm/khub/bin/khub.js
      # The real package is assembled from goreleaser artifacts on a tag
      # (release.yml). npm/smoke.sh proves the assembler itself on every PR,
      # over fixture tarballs. It lives in a file, not inline here, so it is
      # runnable locally and covered by the shellcheck step above.
      - name: Assembly smoke over fixture tarballs
        run: npm/smoke.sh
