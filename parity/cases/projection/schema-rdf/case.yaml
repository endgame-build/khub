# `schema rdf` projects the resolved schema to RDFS + SHACL Turtle. The
# firm-ops render on stdout (`--out -`) is the golden fixture docs/rdf-mapping.md
# points at. The default write lands in .khub/generated/, which the tree
# manifest ignores, so the sh step proves it exists; `--out schema.ttl`
# writes inside the tree and the manifest pins those bytes. `--instances`
# adds the ABox: typed individuals, present attributes as literals typed by
# the DECLARED kind (a date in a datetime field is midnight, a datetime in a
# date field keeps its time under the widened date shape, a text field YAML
# reads back as a boolean is "true", a mapping in a text field is its JSON
# text), forward edges as object properties, no derived inverse. `--base`
# moves every minted IRI but the khub: vocabulary. A dry run writes nothing
# and reports.
steps:
- argv: ["init", "firm-ops", ".", "--no-wire"]
- argv: ["add", "person", "--name", "Noor", "--role", "partner"]
- argv: ["add", "client", "--name", "Initech", "--industry", "Software", "--crm_id", "42"]
- argv: ["add", "opportunity", "--name", "Initech POV", "--stage", "prospect", "--client", "initech", "--owner", "noor", "--tags", "pov,q1"]
- argv: ["add", "meeting", "--title", "Kickoff \"call\"", "--date", "2026-01-15T10:00:00", "--call_type", "client", "--source", "manual", "--engagement", "initech-pov", "--owner", "noor"]
- argv: ["add", "meeting", "--title", "Date only", "--date", "2026-01-15", "--call_type", "internal", "--source", "manual", "--engagement", "initech-pov"]
- argv: ["add", "client", "--name", "Stamped", "--created", "2026-01-15 10:00:00"]
- argv: ["add", "client", "--name", "Yes Co", "--industry", "yes"]
- sh: "printf -- '---\\ntype: client\\nname: Nested\\ncreated: 2026-01-15\\nupdated: 2026-01-15\\nwebsite: {nested: {deep: true}}\\n---\\n' > clients/nested.md"
- argv: ["validate"]
- argv: ["schema", "rdf", "--dry-run"]
- sh: "test ! -e .khub/generated/schema.ttl"
- argv: ["schema", "rdf"]
- sh: "test -s .khub/generated/schema.ttl"
- argv: ["schema", "rdf", "--out", "-"]
- argv: ["schema", "rdf", "--out", "schema.ttl", "--instances", "--format", "json"]
- argv: ["schema", "rdf", "--out", "-", "--instances", "--base", "https://example.org/kb/"]
