# The TTY output: the prompt, a recorded verdict, a dry run, and the lens
# lines of check --require-lenses on the failing and the passing path.
mode: human
steps:
- argv: ["init", "build-hub", ".", "--no-wire"]
- argv: ["add", "requirement", "--title", "Invoice totals", "--kind", "constraint"]
- argv: ["review", "--changed", "knowledge/requirements/req-invoice-totals.md"]
- argv: ["check", "--require-lenses", "--changed", "knowledge/requirements/req-invoice-totals.md"]
- argv: ["review", "--record", "-", "--by", "human:ana", "--dry-run"]
  stdin: '{"verdicts": [{"id": "req-invoice-totals", "lens": "single", "rev": "cf829f80c682", "verdict": "pass"}]}'
- argv: ["review", "--record", "-", "--by", "human:ana"]
  stdin: '{"verdicts": [{"id": "req-invoice-totals", "lens": "single", "rev": "cf829f80c682", "verdict": "pass"}, {"id": "req-invoice-totals", "lens": "testable", "rev": "cf829f80c682", "verdict": "pass"}, {"id": "req-invoice-totals", "lens": "violation", "rev": "cf829f80c682", "verdict": "pass"}, {"id": "req-invoice-totals", "lens": "realized", "rev": "cf829f80c682", "verdict": "fail", "note": "Link the component."}]}'
- argv: ["check", "--require-lenses", "--changed", "knowledge/requirements/req-invoice-totals.md"]
- argv: ["review", "--record", "-", "--by", "human:ana"]
  stdin: '{"verdicts": [{"id": "req-invoice-totals", "lens": "realized", "rev": "cf829f80c682", "verdict": "pass"}]}'
- argv: ["review", "--changed", "knowledge/requirements/req-invoice-totals.md"]
- argv: ["check", "--require-lenses", "--changed", "knowledge/requirements/req-invoice-totals.md"]
- argv: ["review", "--record", "-", "--by", "human:ana"]
  stdin: '{"verdicts": []}'
