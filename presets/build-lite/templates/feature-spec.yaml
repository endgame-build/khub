# The four headings are the ones this type shipped with; all four stay required. No
# section rule here — a spec is written in pieces over days, and a rule that fires on
# a half-written one gets routed around rather than fixed. The lenses carry the
# judgement instead.

title: Feature spec
sections:
- heading: Summary
  hint: the bounded change, three sentences
- heading: Scope
  hint: in / out - explicit
- heading: Behaviour
  hint: EARS statements or user stories; link the requirement ids (req- slugs) this satisfies
- heading: Acceptance criteria
  hint: testable; this is the test spec - the tests themselves live in the repo

lenses:
- code: scope
  name: In and out, both named
  section: Scope
  instruction: |
    Does Scope say what is out as sharply as what is in? A spec that only lists what it
    does is the one that grows a nearby feature nobody asked for. Name the thing a
    reasonable reader would assume is included and is not.
- code: acceptance
  name: Every criterion is observable
  section: Acceptance criteria
  after: scope
  instruction: |
    Could someone who did not write this tell, from outside, whether each criterion is
    met? "Works correctly" is not a criterion; a request, a response and a number are.
    Each one should map to a test that can fail.
