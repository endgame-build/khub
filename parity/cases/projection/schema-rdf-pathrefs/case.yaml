# Under `path_refs` an existing file satisfies a `to: any` relation without an
# edge, and `check` passes; the ABox emits the file as a khub:File node under
# the workspace namespace and the shape admits one, so the file's own shapes
# hold. Then the refusals: a `--base` without a scheme or without a closing
# separator (`invalid_base`), a `--out` naming a directory (`invalid_out`),
# and a relative `--out` that would leave the workspace (`unsafe_path`).
steps:
- argv: ["init", "build-hub", ".", "--no-wire"]
- sh: "printf '# A guide\\n' > guide.md && printf '  adr:\\n    path_refs: true\\n' >> .khub/policy.yaml"
- argv: ["add", "adr", "--title", "Use the guide", "--status", "accepted", "--affects", "guide.md"]
- argv: ["schema", "rdf", "--out", "-", "--instances"]
- argv: ["schema", "rdf", "--base", "http://x"]
- argv: ["schema", "rdf", "--base", "rel/path", "--format", "json"]
- argv: ["schema", "rdf", "--out", "."]
- argv: ["schema", "rdf", "--out", "knowledge", "--format", "json"]
- argv: ["schema", "rdf", "--out", "../escape.ttl"]
